<title id="panel-run-toxin-panel-t">The Toxin State panel (the suit failing)</title>
<desc id="panel-run-toxin-panel-d">Pulse 100: the one panel the Toxin State gets. Green creeps in from the four corners over the ink; in the middle, a black silhouette at the wrong proportion, shoulders too high, a joint too many, with straps snapping and plates lifting away from it in white flecks. The panel cuts before any act.</desc>
