<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="fiche-frame-blank-t fiche-frame-blank-d">
<title id="fiche-frame-blank-t">Subject frame (blank)</title>
<desc id="fiche-frame-blank-d">A subject frame as it fills the reader's hood, blank: an RCC subject record with four cut fields, NAME, NO., INTAKE and DISTINGUISHING MARKS. The page writes each child's line in at run time.</desc>
<rect x="0" y="0" width="480" height="320" fill="#0a0a0a"/>
<rect x="8" y="8" width="464" height="304" fill="none" stroke="#efeee8" stroke-width="2"/>
<line x1="8" y1="52" x2="472" y2="52" stroke="#efeee8" stroke-width="1.5"/>
<text x="22" y="38" font-size="18" font-family="monospace" fill="#efeee8" text-anchor="start" letter-spacing="2.2" font-weight="bold">RCC  ·  SUBJECT RECORD</text>
<circle cx="450" cy="30" r="2" fill="#efeee8"/>
<circle cx="438" cy="30" r="2" fill="#efeee8"/>
<circle cx="426" cy="30" r="2" fill="#efeee8"/>
<circle cx="414" cy="30" r="2" fill="#efeee8"/>
<circle cx="402" cy="30" r="2" fill="#efeee8"/>
<circle cx="390" cy="30" r="2" fill="#efeee8"/>
<text x="22" y="92" font-size="13" font-family="monospace" fill="#efeee8" text-anchor="start" letter-spacing="1.6">NAME</text>
<line x1="22" y1="118" x2="458" y2="118" stroke="#efeee8" stroke-width="0.8"/>
<text x="22" y="144" font-size="13" font-family="monospace" fill="#efeee8" text-anchor="start" letter-spacing="1.6">NO.</text>
<line x1="22" y1="170" x2="458" y2="170" stroke="#efeee8" stroke-width="0.8"/>
<text x="22" y="196" font-size="13" font-family="monospace" fill="#efeee8" text-anchor="start" letter-spacing="1.6">INTAKE</text>
<line x1="22" y1="222" x2="458" y2="222" stroke="#efeee8" stroke-width="0.8"/>
<text x="22" y="248" font-size="13" font-family="monospace" fill="#efeee8" text-anchor="start" letter-spacing="1.6">DISTINGUISHING MARKS</text>
<line x1="22" y1="274" x2="458" y2="274" stroke="#efeee8" stroke-width="0.8"/>
</svg>
