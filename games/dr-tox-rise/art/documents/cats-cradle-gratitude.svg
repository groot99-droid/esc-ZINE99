<title id="cats-cradle-gratitude-t">Chalk caption: Gratitude.</title>
<desc id="cats-cradle-gratitude-d">The warm caption the leash figure gives every time a ghost hand fails: the single word Gratitude. in neat chalk on a strip of painted sky, too tidy, like a teacher's hand.</desc>
