<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-labelledby="barrier-escort-cloud-t barrier-escort-cloud-d">
<title id="barrier-escort-cloud-t">Canister cloud (absorb for Load)</title>
<desc id="barrier-escort-cloud-d">The cloud a canister leaves: a flat, lumpy, pale grey-green shape in an even outline with a few rounder puffs inside it. Standing in it gives Aegis Load.</desc>
