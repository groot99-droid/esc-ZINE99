<path d="M36,52 L284,52 L268,138 L52,138Z" fill="url(#aftermath-set-aside-tone1)"/>
<rect x="100" y="112" width="120" height="30" fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
<text x="160" y="134" font-size="18" font-family="sans-serif" fill="#111111" text-anchor="middle" font-weight="bold" letter-spacing="2">NOT HIS</text>
</svg>
