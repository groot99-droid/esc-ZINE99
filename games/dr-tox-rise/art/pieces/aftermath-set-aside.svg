<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" width="320" height="160" role="img" aria-labelledby="aftermath-set-aside-t aftermath-set-aside-d">
<title id="aftermath-set-aside-t">Set-aside tray (not his)</title>
