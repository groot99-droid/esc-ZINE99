<title id="cage-syringe-t">The lead-shielded syringe</title>
<desc id="cage-syringe-d">The lead-shielded syringe in flats: a heavy grey shield over the barrel with a window showing the amber dose, a plunger and a fine needle. The bible's first signature image's one object.</desc>
