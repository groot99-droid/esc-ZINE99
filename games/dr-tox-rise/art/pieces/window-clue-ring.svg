<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" role="img" aria-labelledby="window-clue-ring-t window-clue-ring-d">
<title id="window-clue-ring-t">Clue ring (tapped in a photo)</title>
<desc id="window-clue-ring-d">A loose grease-pencil ellipse in red, drawn twice round, for a detail the player tapped in a photo (the water bowl, the leash hook) to add a hidden round.</desc>
<ellipse cx="80" cy="60" rx="66" ry="44" fill="none" stroke="#b3261e" stroke-width="4" opacity="0.9" transform="rotate(-6 80 60)"/>
<ellipse cx="80" cy="60" rx="62" ry="48" fill="none" stroke="#b3261e" stroke-width="3" opacity="0.7" transform="rotate(4 80 60)"/>
<line x1="130" y1="20" x2="150" y2="6" stroke="#b3261e" stroke-width="3" stroke-linecap="round"/>
<line x1="134" y1="26" x2="156" y2="18" stroke="#b3261e" stroke-width="2" stroke-linecap="round"/>
<circle cx="146" cy="10" r="2" fill="#b3261e"/>
<circle cx="152" cy="16" r="1.5" fill="#b3261e"/>
<circle cx="14" cy="100" r="1.5" fill="#b3261e"/>
</svg>
