<title id="fiche-hood-t">Reader hood (the screen)</title>
<desc id="fiche-hood-d">The fiche reader's hood: a heavy bezel cut in parallel lines, a large black screen with a thin white rim and faint scan lines, and a cut nameplate below. The frame is shown in the screen at run time.</desc>
