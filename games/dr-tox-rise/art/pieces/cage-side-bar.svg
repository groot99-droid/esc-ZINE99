<title id="cage-side-bar-t">Side bar: LEAKY, ENDPOINT, HOT</title>
<desc id="cage-side-bar-d">The instrument's side bar in flats: a tall column split into three bands. LEAKY at the top in pale teal, ENDPOINT in the middle as a narrow amber window, HOT at the bottom in a small green band, smaller than the amber. Lettered in black capitals.</desc>
