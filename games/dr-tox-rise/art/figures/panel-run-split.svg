<title id="panel-run-split-t">The Split (carries him over a gap)</title>
<desc id="panel-run-split-d">The Split as a black silhouette, half human and half toad, crouched to leap: a broad low body, a pale seam drawn down where the halves meet. In the gutter he carries Alexander over a gap.</desc>
