<title id="barrier-escort-other-hero-t">The other hero (a line of motion)</title>
<desc id="barrier-escort-other-hero-d">The other hero as the page shows her: a dark slate silhouette leaning into an unhurried stride, a long sweep of motion lines behind her that the player cannot steer. She never needs a wall.</desc>
