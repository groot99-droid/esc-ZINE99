<rect x="0" y="0" width="320" height="420" fill="#ffffff"/>
<rect x="8" y="8" width="304" height="404" fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
<rect x="20" y="20" width="280" height="240" fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
<g clip-path="url(#aftermath-trace-strap-clip1)">
<path d="M20,20 L300,20 L300,260 L20,260Z" fill="url(#aftermath-trace-strap-tone2)"/>
<path d="M40,170 C100,140 160,190 220,150" fill="none" stroke="#111111" stroke-width="16"/>
<path d="M40,170 C100,140 160,190 220,150" fill="none" stroke="#ffffff" stroke-width="10"/>
<rect x="70" y="150" width="26" height="20" fill="#ffffff" stroke="#111111" stroke-width="3" stroke-linejoin="round"/>
<path d="M220,150 l16,-14 m-16,14 l20,-2 m-20,2 l14,10" fill="none" stroke="#111111" stroke-width="2.5"/>
</g>
<text x="22" y="294" font-size="20" font-family="sans-serif" fill="#111111" text-anchor="start" font-weight="bold" letter-spacing="1">TORN STRAP</text>
<line x1="22" y1="306" x2="298" y2="306" stroke="#111111" stroke-width="1.5"/>
<text x="22" y="334" font-size="17" font-family="serif" fill="#111111" text-anchor="start">Torn before the dent: no glass</text>
<text x="22" y="358" font-size="17" font-family="serif" fill="#111111" text-anchor="start">under it.</text>
</svg>
