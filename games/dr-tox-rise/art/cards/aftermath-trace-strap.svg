<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-labelledby="aftermath-trace-strap-t aftermath-trace-strap-d">
<title id="aftermath-trace-strap-t">Trace: Torn strap</title>
<desc id="aftermath-trace-strap-d">Trace card: a suit strap torn through, its buckle still closed: torn before the locker was struck.</desc>
