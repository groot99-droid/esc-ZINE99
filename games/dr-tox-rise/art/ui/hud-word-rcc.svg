<title id="hud-word-rcc-t">Terminology Rule: RCC (the plate)</title>
<desc id="hud-word-rcc-d">The word RCC as the State's own signage has it: stamped capitals on a riveted gray-teal plate. Legible to the player; to no HOPE character.</desc>
