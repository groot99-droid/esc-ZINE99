<title id="cage-bench-2217-t">The Cage backdrop: the bench in the hospital room (2217)</title>
<desc id="cage-bench-2217-d">The bench a fifteen-year-old built, in flat colourist's fills: pale clinical wall, two IV poles, steel trays clamped between them, a strip light above, clear tubing in a loose loop; the middle of the bench is left clear for the flask and the dropper.</desc>
