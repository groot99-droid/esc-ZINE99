<title id="loading-room-t">Loading backdrop: the hospital room, 2217</title>
<desc id="loading-room-d">The hospital room locked off and symmetrical under flat fluorescent tubes: a clear plastic breath tent over a bed, a thin upright figure behind the plastic, and against the wall the bench a child built from IV poles, steel trays and clamps, one amber vial on it the only warm thing.</desc>
