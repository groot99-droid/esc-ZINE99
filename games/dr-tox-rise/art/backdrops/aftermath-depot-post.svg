<title id="aftermath-depot-post-t">Aftermath room: the depot guard post</title>
<desc id="aftermath-depot-post-d">The depot guard post after, wide and still, in screentone: a desk shoved askew, a chair on its side, a wall clock, a strip light hanging dead from one chain, a dented locker, a torn strap on the floor, and a long scrape running to the door he dragged himself through. No one is in the room.</desc>
