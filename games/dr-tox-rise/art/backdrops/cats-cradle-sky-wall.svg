<title id="cats-cradle-sky-wall-t">Cat's Cradle backdrop: Sky Room's painted wall</title>
<desc id="cats-cradle-sky-wall-d">Sky Room's concrete wall painted with a blue sky and green fields in flat poster paint, brush marks showing in the blue, a few lumpy white clouds and a painted sun that does not shine; flat white light, a strip of bare concrete at the floor where the paint stops.</desc>
