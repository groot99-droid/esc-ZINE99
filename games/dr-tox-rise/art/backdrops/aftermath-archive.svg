<title id="aftermath-archive-t">Aftermath room: the archive (Green ending)</title>
<desc id="aftermath-archive-d">The Snakehead archive after, wider and emptier, in screentone: rows of fiche cabinets receding, a stair rail bent outward, a doorway etched pale at its edges, a dropped torch on the floor, and a great deal of empty dark-toned floor where the tents will stand. No one is in the room.</desc>
