<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="barrier-escort-t barrier-escort-d">
<title id="barrier-escort-t">Barrier escort: Franco-Belgian ligne claire</title>
<desc id="barrier-escort-d">Barrier escort (2D): the lower-ring supply corridor side-on in clear line, even outlines and flat colour with no hatching. A transport rolls left to right under a concrete deck; Aegis, in amber-lit light, draws hard-light walls as clean pale bars that turn thrown debris aside. Behind two of the walls small people are penned in, each with a name tag on the bar; a Load gauge in the corner empties as the walls go up.</desc>
