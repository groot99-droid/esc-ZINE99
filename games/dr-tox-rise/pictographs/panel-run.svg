<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="panel-run-t panel-run-d">
<title id="panel-run-t">Panel run: Noir spotted-black brush ink</title>
<desc id="panel-run-d">Panel run (2D): a break-in drawn as a comic page in spotted black brush ink. Alexander's thin upright silhouette crosses a row of panels left to right; the white gutters between them skip time, so a guard's torch cone is in a different place in each panel. Two possible next panels branch below the current one and an arrow marks the one the player picked. A monitor line along the bottom margin is amber where he waited and green-tinged where he drew a dart from the shunt.</desc>
