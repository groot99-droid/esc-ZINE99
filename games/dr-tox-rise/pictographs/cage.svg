<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="cage-t cage-d">
<title id="cage-t">The Cage: Comic colourist's flats</title>
<desc id="cage-d">The Cage (1D): titration drawn as a colourist's flats page, every area filled flat to its line with no shading. A dropper over a stoppered flask lets fall counted drops of an invented amber reagent; inside the flask an amber band holds against a sickly green front pushing up from below. A lead shield wraps half the flask. To the right a bar marks the endpoint window: stop the drip there. Amber and green are never at equal weight on the page.</desc>
