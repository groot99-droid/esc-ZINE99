<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="cats-cradle-t cats-cradle-d">
<title id="cats-cradle-t">Cat's Cradle: Chalk and poster paint on the painted sky</title>
<desc id="cats-cradle-d">Cat's Cradle (1D): a string figure held between four pairs of small hands, drawn in chalk over the flat poster-paint sky and green fields of Sky Room's walls, in a flat clinical white light. One crossing of the string is lifted by a fifth finger: the move the player is making. A row of four chalk names along the bottom shows whose hands are whose.</desc>
