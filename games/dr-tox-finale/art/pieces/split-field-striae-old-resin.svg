<title id="split-field-striae-old-resin-t">Split Field: striae, old-resin</title>
<desc id="split-field-striae-old-resin-d">Split Field striae, old-resin: old resin from the rite jars, not of this day: a glossy drip shape in line tone, its edge crazed. A full disc in ink and Craftint tone, clipped to one half of the comparison circle at run time and slid and turned against the mark.</desc>
