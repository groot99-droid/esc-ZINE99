<title id="panes-piece-parallelogram-t">Panes: piece, parallelogram</title>
<desc id="panes-piece-parallelogram-d">Panes piece, the parallelogram of the tangram set: a hard-light pane as a foil facet, pale gold over rainbow foil with diagonal sheen bands and facet lines to its corners, a white edge. Drawn at 120 px to the tangram unit; drag, rotate and flip it into the breach.</desc>
