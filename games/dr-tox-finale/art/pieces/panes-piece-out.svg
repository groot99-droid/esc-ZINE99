<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 186 101" width="186" height="101" role="img" aria-labelledby="panes-piece-out-t panes-piece-out-d">
<title id="panes-piece-out-t">Panes: a pane gone out (the flinch)</title>
<desc id="panes-piece-out-d">A pane gone out for a second when the leash fires: the same triangle as a cold gray-teal outline, dashed, the foil gone; laid over every set pane while it lasts.</desc>
