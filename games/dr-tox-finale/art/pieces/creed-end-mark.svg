<line x1="58" y1="36" x2="70" y2="80" stroke="#1a1a1a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="82" y1="36" x2="94" y2="80" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4 4"/>
