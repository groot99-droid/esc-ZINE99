<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" width="260" height="180" role="img" aria-labelledby="creed-tile-frame-t creed-tile-frame-d">
<title id="creed-tile-frame-t">Creed: tile frame (two ends and a line of his)</title>
<desc id="creed-tile-frame-d">A domino tile as a two-panel strip from the tract: a heavy outline, a centre rule, two empty end slots for the end panels, and a ruled caption bar across the top where his line is lettered at run time, split at the rule.</desc>
