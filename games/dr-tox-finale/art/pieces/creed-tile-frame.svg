<line x1="130" y1="8" x2="130" y2="172" stroke="#1a1a1a" stroke-width="3"/>
<rect x="10" y="40" width="114" height="132" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
<rect x="136" y="40" width="114" height="132" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 3" opacity="0.6"/>
<circle cx="130" cy="106" r="5" fill="#1a1a1a"/>
<line x1="14" y1="30" x2="124" y2="30" stroke="#1a1a1a" stroke-width="0.6" opacity="0.4"/>
<line x1="136" y1="30" x2="246" y2="30" stroke="#1a1a1a" stroke-width="0.6" opacity="0.4"/>
