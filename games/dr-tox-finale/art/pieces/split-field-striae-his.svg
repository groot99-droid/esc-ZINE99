<title id="split-field-striae-his-t">Split Field: striae, his</title>
<desc id="split-field-striae-his-d">Split Field striae, his: his plate's edge: a few broad, glassy-smooth bands with fine cracks across them, the lacquered scab. A full disc in ink and Craftint tone, clipped to one half of the comparison circle at run time and slid and turned against the mark.</desc>
