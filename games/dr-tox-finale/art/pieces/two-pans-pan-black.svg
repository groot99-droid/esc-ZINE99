<title id="two-pans-pan-black-t">Two Pans: the BLACK pan</title>
<desc id="two-pans-pan-black-d">Two Pans: the BLACK pan hanging from its hook on three chains, a deep dish filled flat black, its name lettered on the dish. Hook at the top centre; tokens sit along the rim.</desc>
