<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" width="260" height="180" role="img" aria-labelledby="creed-tile-string-t creed-tile-string-d">
<title id="creed-tile-string-t">Creed: the string tile (dealt to him)</title>
<desc id="creed-tile-string-d">The other tile that is not his: a cat's-cradle loop of string drawn across both ends over a wash of the painted sky, a child's game remembered by an adult hand; no word on either end.</desc>
