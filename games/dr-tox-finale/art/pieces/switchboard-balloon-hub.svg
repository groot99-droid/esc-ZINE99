<rect x="138" y="118" width="24" height="8" fill="#fbfaf6"/>
<line x1="34" y1="44" x2="266" y2="44" stroke="#8EC5E8" stroke-width="1.2"/>
<line x1="34" y1="83" x2="266" y2="83" stroke="#8EC5E8" stroke-width="1.2"/>
<text x="150" y="82" font-size="50" font-family="sans-serif" fill="#141414" text-anchor="middle" font-weight="bold" letter-spacing="2">HUB</text>
<circle cx="150" cy="144" r="5" fill="#141414"/>
</svg>
