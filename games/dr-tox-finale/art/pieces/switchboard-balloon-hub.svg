<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150" role="img" aria-labelledby="switchboard-balloon-hub-t switchboard-balloon-hub-d">
<title id="switchboard-balloon-hub-t">Switchboard: balloon, HUB</title>
<desc id="switchboard-balloon-hub-d">Switchboard balloon HUB: the circuit the last dose will ride, drawn larger, three tails in Switchboard 1 and five in 2. An inked speech balloon with hand-lettered capitals on blue guidelines; its tail point at the bottom centre is where the patch cord leaves for a panel.</desc>
<path d="M136.0,120.0 L150.0,146 L164.0,120.0" fill="#fbfaf6" stroke="#141414" stroke-width="4" stroke-linejoin="round"/>
