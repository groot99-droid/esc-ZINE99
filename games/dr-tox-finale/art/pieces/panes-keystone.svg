<line x1="93" y1="66" x2="178" y2="93" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
<line x1="93" y1="66" x2="93" y2="8" stroke="#ffffff" stroke-width="2" opacity="0.7"/>
