<path d="M20,6 L25,60 L15,60Z" fill="#C8202A"/>
<circle cx="20" cy="240" r="16" fill="#1a1a1a"/>
<circle cx="20" cy="240" r="5" fill="#C8202A"/>
<line x1="20" y1="70" x2="20" y2="220" stroke="#e8dcc2" stroke-width="1" opacity="0.4"/>
</svg>
