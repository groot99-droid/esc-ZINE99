<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 180" width="260" height="180" role="img" aria-labelledby="creed-tile-sky-t creed-tile-sky-d">
<title id="creed-tile-sky-t">Creed: the sky tile (dealt to him)</title>
<desc id="creed-tile-sky-d">A double that is not his: both ends painted sky blue with soft white clouds, laid inside the tract's printed frame. It matches nothing; it is the only colour on the page not printed in the tract's inks.</desc>
