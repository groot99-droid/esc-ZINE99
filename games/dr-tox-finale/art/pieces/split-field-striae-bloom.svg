<title id="split-field-striae-bloom-t">Split Field: striae, bloom</title>
<desc id="split-field-striae-bloom-d">Split Field striae, bloom: an old bloom stain from Fall, not of this day: a soft tone blot with a ragged edge and no striae. A full disc in ink and Craftint tone, clipped to one half of the comparison circle at run time and slid and turned against the mark.</desc>
