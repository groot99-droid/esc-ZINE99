<title id="procession-front-banner-t">Procession: the banner at the head of the march</title>
<desc id="procession-front-banner-d">The banner at the head of the march between two poles: HE IS THE RING in ransom-note letters cut from photocopies, stapled to a sheet; reaching it is reaching the front.</desc>
