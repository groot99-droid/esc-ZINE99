<title id="split-field-striae-theirs-t">Split Field: striae, theirs</title>
<desc id="split-field-striae-theirs-d">Split Field striae, theirs: their blade's twin channel: two deep parallel grooves with fine striae beside them, the hollow knife's. A full disc in ink and Craftint tone, clipped to one half of the comparison circle at run time and slid and turned against the mark.</desc>
