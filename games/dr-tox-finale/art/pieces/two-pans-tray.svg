<circle cx="426" cy="70" r="28" fill="#2a2a2a" stroke="#C8202A" stroke-width="3"/>
<circle cx="490" cy="70" r="28" fill="#2a2a2a" stroke="#C8202A" stroke-width="3"/>
<text x="22" y="78" font-size="20" font-family="sans-serif" fill="#C8202A" text-anchor="start" font-weight="bold" letter-spacing="2">TOKENS</text>
