<rect x="98" y="88" width="24" height="8" fill="#fbfaf6"/>
<line x1="34" y1="33.2" x2="186" y2="33.2" stroke="#8EC5E8" stroke-width="1.2"/>
<line x1="34" y1="64.4" x2="186" y2="64.4" stroke="#8EC5E8" stroke-width="1.2"/>
<text x="110" y="63.6" font-size="40" font-family="sans-serif" fill="#C8202A" text-anchor="middle" font-weight="bold" letter-spacing="2">LOCK</text>
<circle cx="110" cy="114" r="5" fill="#C8202A"/>
