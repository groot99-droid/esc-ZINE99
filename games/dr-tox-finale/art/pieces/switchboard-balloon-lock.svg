<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" width="220" height="120" role="img" aria-labelledby="switchboard-balloon-lock-t switchboard-balloon-lock-d">
<title id="switchboard-balloon-lock-t">Switchboard: balloon, LOCK</title>
<desc id="switchboard-balloon-lock-d">Switchboard balloon LOCK: one of the State's interlocks, lettered in red: it cuts THE PLINTH's only tail whenever THE TOWERS drop below two tails. An inked speech balloon with hand-lettered capitals on blue guidelines; its tail point at the bottom centre is where the patch cord leaves for a panel.</desc>
