<title id="panes-piece-small-b-t">Panes: piece, small b</title>
<desc id="panes-piece-small-b-d">Panes piece, the small b of the tangram set: a hard-light pane as a foil facet, pale gold over rainbow foil with diagonal sheen bands and facet lines to its corners, a white edge. Drawn at 120 px to the tangram unit; drag, rotate and flip it into the breach.</desc>
