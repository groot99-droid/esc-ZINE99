<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" role="img" aria-labelledby="creed-lector-t creed-lector-d">
<title id="creed-lector-t">Creed: the lector at the drum (Mercy, reading)</title>
<desc id="creed-lector-d">The lector in the tract's own plain cartoon line: a woman's figure from behind a lectern made from a steel drum, the stapled booklet open on it, one hand raised as she reads. No face: the head is a plain outline. Mercy's name is lettered under it at run time.</desc>
