<title id="creed-tox-hand-t">Creed: his gloved hand laying a tile</title>
<desc id="creed-tox-hand-d">His hand from the near side in the tract's plain line, a black glove filled solid with the shroud's hem hatched at the wrist, two fingers pressing a tile down onto the table.</desc>
