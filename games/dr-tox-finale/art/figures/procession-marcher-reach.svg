<title id="procession-marcher-reach-t">Procession: marcher (reach)</title>
<desc id="procession-marcher-reach-d">Procession figure: a marcher reaching forward on purpose, one arm out: someone who wants into the ring, cut from a photocopy with a white cut edge and pasted in black toner; no face, an adult. Name, want and one word are lettered above at run time.</desc>
