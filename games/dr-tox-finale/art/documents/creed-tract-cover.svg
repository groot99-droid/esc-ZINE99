<title id="creed-tract-cover-t">Creed: the tract's cover</title>
<desc id="creed-tract-cover-d">The pocket tract's cover: a heavy red title band reading HIS WORDS, a plain-line cartoon panel of a ring of small people round an empty space, two staples at the spine, and a ruled line at the foot for the doctrine. Printed on thin paper, two inks.</desc>
