<title id="two-pans-rack-t">Two Pans: RCC's rack of vials (Two Pans 2)</title>
<desc id="two-pans-rack-d">The suite's rack as a pulp would print it: a black steel rack with twelve vials, nine filled black and three red, a stamped RCC plate on the front. It sits in the window, and always did; it carries no other label.</desc>
