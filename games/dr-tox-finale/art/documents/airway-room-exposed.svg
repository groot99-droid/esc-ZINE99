<title id="airway-room-exposed-t">Airway: an exposed room (people leaving, coughing)</title>
<desc id="airway-room-exposed-d">The same room after the plume passed over its grille: the box is inked now, a grey wash has come down through the slots, the door at the right is open and three small figures are going out of it with cough marks over them. Nobody is shown harmed; the names are kept on the record.</desc>
