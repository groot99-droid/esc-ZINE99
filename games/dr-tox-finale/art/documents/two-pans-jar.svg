<title id="two-pans-jar-t">Two Pans: a rite jar (Two Pans 1)</title>
<desc id="two-pans-jar-d">One of the cult's rite jars as the pulp draws it: a wide jar with a screw lid, filled half red and half black in two flat bands, a torn paper label with a ring drawn on it, a black shadow; it stands for a load of tokens and says nothing about what is in it.</desc>
