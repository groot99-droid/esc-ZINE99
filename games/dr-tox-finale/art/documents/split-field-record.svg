<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 600" width="320" height="600" role="img" aria-labelledby="split-field-record-t split-field-record-d">
<title id="split-field-record-t">Split Field: the record strip (blank)</title>
<desc id="split-field-record-d">The record strip at the right of the board: RECORD in heavy capitals over a band of line tone, then five ruled entries, each with a line for a name, a smaller line for the want, and BY: for what made the mark. Filled in as marks lock; it names the hurt and never shows a wound.</desc>
