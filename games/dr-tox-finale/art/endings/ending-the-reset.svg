<title id="ending-the-reset-t">Ending: The Reset</title>
<desc id="ending-the-reset-d">Ending lettering plate for The Reset (as written): the ending's last image small and still on the left; on the right its name in pale capitals, an amber AS WRITTEN stamp, the cost first, then one line for each lead's state (Dr. Tox, Reese, Cally), and the bible line the card quotes.</desc>
