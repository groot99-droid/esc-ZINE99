<text x="610" y="92" font-size="22" font-family="sans-serif" fill="#C4CDCB" text-anchor="start" letter-spacing="8">ENDING</text>
<text x="606" y="164" font-size="60" font-family="sans-serif" fill="#E9ECEA" text-anchor="start" font-weight="bold" letter-spacing="2">THE RESET</text>
<g transform="rotate(-3 712 210)">
<rect x="608" y="188" width="208" height="42" fill="none" stroke="#D99A2B" stroke-width="3"/>
<text x="712" y="218" font-size="22" font-family="sans-serif" fill="#D99A2B" text-anchor="middle" font-weight="bold" letter-spacing="4">AS WRITTEN</text>
</g>
<text x="608" y="266" font-size="16" font-family="sans-serif" fill="#8A9A99" text-anchor="start" letter-spacing="5">THE COST</text>
<text x="608" y="300" font-size="24" font-family="serif" fill="#E9ECEA" text-anchor="start">His heart; the peace after.</text>
<line x1="608" y1="336" x2="1150" y2="336" stroke="#2f3a3b" stroke-width="2"/>
<text x="608" y="364" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">DR. TOX</text>
<text x="712" y="364" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">held to the end.</text>
<text x="608" y="402" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">REESE</text>
<text x="712" y="402" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">left room; his panes stand round the hub.</text>
<text x="608" y="440" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">CALLY</text>
<text x="712" y="440" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">kept the key.</text>
<text x="608" y="570" font-size="22" font-family="serif" fill="#F2C14E" text-anchor="start" font-style="italic">“What makes it land isn't spectacle; it's the</text>
<text x="608" y="600" font-size="22" font-family="serif" fill="#F2C14E" text-anchor="start" font-style="italic">peace that follows it”</text>
</svg>
