<text x="610" y="92" font-size="22" font-family="sans-serif" fill="#C4CDCB" text-anchor="start" letter-spacing="8">ENDING</text>
<text x="606" y="164" font-size="60" font-family="sans-serif" fill="#E9ECEA" text-anchor="start" font-weight="bold" letter-spacing="2" textLength="550" lengthAdjust="spacingAndGlyphs">THE CAGE HOLDS</text>
<text x="608" y="232" font-size="16" font-family="sans-serif" fill="#8A9A99" text-anchor="start" letter-spacing="5">THE COST</text>
<text x="608" y="266" font-size="24" font-family="serif" fill="#E9ECEA" text-anchor="start">He lives; the cult's own resin attack.</text>
<line x1="608" y1="302" x2="1150" y2="302" stroke="#2f3a3b" stroke-width="2"/>
<text x="608" y="330" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">DR. TOX</text>
<text x="712" y="330" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">lives; doses under the lamp.</text>
<text x="608" y="368" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">REESE</text>
<text x="712" y="368" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">held a wall nobody came through.</text>
<text x="608" y="406" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">CALLY</text>
<text x="712" y="406" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">kept the key.</text>
</svg>
