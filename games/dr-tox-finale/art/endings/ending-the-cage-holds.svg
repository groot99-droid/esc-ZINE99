<path d="M306,417.6 L311.4,412 L311.4,405 L324.6,405 L324.6,412 L330,417.6 L330,467.8 Q330,475 318,475 Q306,475 306,467.8Z" fill="#D99A2B" stroke="#141414" stroke-width="3"/>
<path d="M120,635 L150,520 C160,500 190,492 220,494 L250,496 L250,560 L200,635Z" fill="#0e0e0e"/>
