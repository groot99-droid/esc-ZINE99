<polygon points="460,60 380,220 460,380" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
<polygon points="220,220 380,220 300,380" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
<polygon points="140,380 300,380 220,530" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
<polygon points="300,380 460,380 380,530" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
