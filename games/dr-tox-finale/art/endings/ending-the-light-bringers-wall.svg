<rect x="40" y="530" width="520" height="105" fill="#141210"/>
<path d="M180,592 C210,578 300,576 390,584 L392,596 L180,600Z" fill="#5F6F5A" stroke="#2a2f28" stroke-width="2"/>
<rect x="40" y="40" width="520" height="595" fill="none" stroke="#2f3a3b" stroke-width="3"/>
<text x="610" y="92" font-size="22" font-family="sans-serif" fill="#C4CDCB" text-anchor="start" letter-spacing="8">ENDING</text>
<text x="606" y="164" font-size="60" font-family="sans-serif" fill="#E9ECEA" text-anchor="start" font-weight="bold" letter-spacing="2">THE LIGHT</text>
<text x="606" y="228" font-size="60" font-family="sans-serif" fill="#E9ECEA" text-anchor="start" font-weight="bold" letter-spacing="2" textLength="550" lengthAdjust="spacingAndGlyphs">BRINGER'S WALL</text>
<text x="608" y="296" font-size="16" font-family="sans-serif" fill="#8A9A99" text-anchor="start" letter-spacing="5">THE COST</text>
<text x="608" y="330" font-size="24" font-family="serif" fill="#E9ECEA" text-anchor="start">Tox dies outside; the glass stands, and only</text>
<text x="608" y="362" font-size="24" font-family="serif" fill="#E9ECEA" text-anchor="start">the plinth and the road get the dose.</text>
<line x1="608" y1="398" x2="1150" y2="398" stroke="#2f3a3b" stroke-width="2"/>
<text x="608" y="426" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">DR. TOX</text>
<text x="712" y="426" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">outside the glass.</text>
<text x="608" y="464" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">REESE</text>
<text x="712" y="464" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">said HOPE; set the keystone.</text>
<text x="608" y="502" font-size="15" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">CALLY</text>
<text x="712" y="502" font-size="20" font-family="serif" fill="#C4CDCB" text-anchor="start">kept the key.</text>
<text x="608" y="600" font-size="22" font-family="serif" fill="#F2C14E" text-anchor="start" font-style="italic">“The rot must be excised so the tree can</text>
<text x="608" y="630" font-size="22" font-family="serif" fill="#F2C14E" text-anchor="start" font-style="italic">live.”</text>
</svg>
