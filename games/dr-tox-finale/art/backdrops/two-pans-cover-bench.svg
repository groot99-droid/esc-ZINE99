<title id="two-pans-cover-bench-t">Two Pans: cover (bench)</title>
<desc id="two-pans-cover-bench-d">Two Pans cover, the bench in Snakehead with the cult's rite jars and the lamp (Two Pans 1): a pulp cover in red and black on rough stock, the red title band THE TWO PANS with an issue number, the scene in heavy black shadow and red flats down both sides, the middle left clear for the balance.</desc>
