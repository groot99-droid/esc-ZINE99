<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="loading-plain-t loading-plain-d">
<title id="loading-plain-t">Loading backdrop: the last city over the plain, 2240</title>
<desc id="loading-plain-d">The last arcology at dusk from the plain road: glass-and-steel monoliths on a raw concrete plinth, sealed skybridges, a floodlit perimeter fence at its foot and the shanties under the plinth's vents; on the road in front, far off and small, the cult's camp under lanterns. The only warm points are the lanterns and one amber light high in the tower; everything else is the world's gray-teal and dust.</desc>
