<title id="panes-card-back-t">Panes: the card's back (names at the crack)</title>
<desc id="panes-card-back-d">The card's back for Panes 1: a pale-gold foil field with a ring of hard light in the middle and a printed grid of eight blank name stickers, one for each face at the crack; names are laid onto them at run time, and a gap left open shows its sticker lit.</desc>
