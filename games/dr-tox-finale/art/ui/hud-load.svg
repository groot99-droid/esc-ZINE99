<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 48" width="480" height="48" role="img" aria-labelledby="hud-load-t hud-load-d">
<title id="hud-load-t">Load gauge (Aegis, pale gold)</title>
<desc id="hud-load-d">Aegis's Load gauge in the atrium and at the hub: a thin pale-gold bar in HOPE's warm styling, ten segments and the word LOAD; the fill is laid over it at run time. No margin line.</desc>
