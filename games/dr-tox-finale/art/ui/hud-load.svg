<line x1="149.2" y1="14" x2="149.2" y2="34" stroke="#F2C14E" stroke-width="1" opacity="0.5"/>
<line x1="188.8" y1="14" x2="188.8" y2="34" stroke="#F2C14E" stroke-width="1" opacity="0.5"/>
<line x1="228.4" y1="14" x2="228.4" y2="34" stroke="#F2C14E" stroke-width="1" opacity="0.5"/>
<line x1="268" y1="14" x2="268" y2="34" stroke="#F2C14E" stroke-width="1" opacity="0.5"/>
<line x1="307.6" y1="14" x2="307.6" y2="34" stroke="#F2C14E" stroke-width="1" opacity="0.5"/>
<line x1="347.2" y1="14" x2="347.2" y2="34" stroke="#F2C14E" stroke-width="1" opacity="0.5"/>
<line x1="386.8" y1="14" x2="386.8" y2="34" stroke="#F2C14E" stroke-width="1" opacity="0.5"/>
<line x1="426.4" y1="14" x2="426.4" y2="34" stroke="#F2C14E" stroke-width="1" opacity="0.5"/>
<text x="18" y="30" font-size="14" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">LOAD</text>
<rect x="70" y="16" width="396" height="16" rx="8" fill="none" stroke="#F6E7B8" stroke-width="1" opacity="0.7"/>
</svg>
