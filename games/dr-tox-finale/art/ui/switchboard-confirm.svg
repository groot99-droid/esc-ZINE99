<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90" role="img" aria-labelledby="switchboard-confirm-t switchboard-confirm-d">
<title id="switchboard-confirm-t">Switchboard: confirm (OK TO PRINT)</title>
<desc id="switchboard-confirm-d">The confirm as the letterer's sign-off: OK TO PRINT in inked capitals in a ruled box with a blue guideline and a pencilled tick; usable when every panel breathes.</desc>
<rect x="6" y="6" width="268" height="78" fill="#fbfaf6" stroke="#141414" stroke-width="4"/>
<line x1="24" y1="56" x2="256" y2="56" stroke="#8EC5E8" stroke-width="1.2"/>
<text x="140" y="54" font-size="30" font-family="sans-serif" fill="#141414" text-anchor="middle" font-weight="bold" letter-spacing="2">OK TO PRINT</text>
<path d="M226,22 L234,32 L250,14" fill="none" stroke="#9a9a9a" stroke-width="3"/>
<line x1="24" y1="24" x2="120" y2="24" stroke="#8EC5E8" stroke-width="1"/>
</svg>
