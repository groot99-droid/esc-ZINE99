<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 90" width="300" height="90" role="img" aria-labelledby="two-pans-load-t two-pans-load-d">
<title id="two-pans-load-t">Two Pans: the load plate (number laid in)</title>
<desc id="two-pans-load-d">The stated load, as a pulp price flash: a red starburst corner and LOAD in black capitals, PIPS under the space where the number is laid in.</desc>
<rect x="4" y="4" width="292" height="82" fill="#e8dcc2" stroke="#1a1a1a" stroke-width="4"/>
<polygon points="90,45 74,54 78.3,70.5 59.9,66.6 50,81 40.1,66.6 21.7,70.5 26,54 10,45 26,36 21.7,19.5 40.1,23.4 50,9 59.9,23.4 78.3,19.5 74,36" fill="#C8202A" stroke="#1a1a1a" stroke-width="3"/>
<text x="50" y="52" font-size="17" font-family="sans-serif" fill="#1a1a1a" text-anchor="middle" font-weight="bold">LOAD</text>
<text x="270" y="76" font-size="16" font-family="sans-serif" fill="#1a1a1a" text-anchor="end" font-weight="bold" letter-spacing="2">PIPS</text>
<line x1="110" y1="60" x2="220" y2="60" stroke="#1a1a1a" stroke-width="1.5" opacity="0.5"/>
</svg>
