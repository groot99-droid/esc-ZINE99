<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" role="img" aria-labelledby="panes-fumes-t panes-fumes-d">
<title id="panes-fumes-t">Panes: fumes through a gap</title>
<desc id="panes-fumes-d">Fumes coming through an unfilled gap each turn: three dust-brown wisps curling in from outside, soft and printed flat in the card's art style; Reese absorbs them as Load.</desc>
