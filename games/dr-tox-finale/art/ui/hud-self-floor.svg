<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 64" width="480" height="64" role="img" aria-labelledby="hud-self-floor-t hud-self-floor-d">
<title id="hud-self-floor-t">Self gauge with the floor at 40 marked</title>
<desc id="hud-self-floor-d">A Self gauge for the pause screen and the episode menu, never with a number: a long typed caption strip from 0 to 100 with a heavy gray-teal bar at 40 marked FLOOR, and the space under it shaded; the fill is laid over it at run time and never comes back up.</desc>
