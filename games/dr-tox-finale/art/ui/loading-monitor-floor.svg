<title id="loading-monitor-floor-t">Loading monitor line, the Self line lowered to the floor</title>
<desc id="loading-monitor-floor-d">The strip as the bar fills: the dashed SELF line has come down close to a solid gray-teal line marked FLOOR 40, the Finale's rule that under it the man is no longer enough to choose; the amber trace slow and low beneath both. No green: the loading screen never shows the State winning.</desc>
