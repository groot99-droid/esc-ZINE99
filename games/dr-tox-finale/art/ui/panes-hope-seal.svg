<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140" role="img" aria-labelledby="panes-hope-seal-t panes-hope-seal-d">
<title id="panes-hope-seal-t">Panes: the HOPE seal (the Word said)</title>
<desc id="panes-hope-seal-d">A round holographic seal stamped HOPE, as on licensed merchandise: foil rings, a half sun over a bar, the word in warm capitals. Shown on the card when Reese said HOPE at the hub's glass.</desc>
<defs><linearGradient id="panes-hope-seal-lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f6b3c8"/><stop offset="20%" stop-color="#F6E7B8"/><stop offset="40%" stop-color="#a8e6cf"/><stop offset="60%" stop-color="#9fc6f2"/><stop offset="80%" stop-color="#d4b0f2"/><stop offset="100%" stop-color="#f6b3c8"/></linearGradient></defs>
<circle cx="70" cy="70" r="64" fill="url(#panes-hope-seal-lg1)"/>
<circle cx="70" cy="70" r="64" fill="#F6E7B8" opacity="0.4"/>
<circle cx="70" cy="70" r="56" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
<circle cx="70" cy="70" r="48" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
<path d="M46,74 A24,24 0 0,1 94,74Z" fill="#D99A2B"/>
<line x1="40" y1="74" x2="100" y2="74" stroke="#2a2a2a" stroke-width="3"/>
<text x="70" y="104" font-size="20" font-family="sans-serif" fill="#2a2a2a" text-anchor="middle" font-weight="bold" letter-spacing="3">HOPE</text>
