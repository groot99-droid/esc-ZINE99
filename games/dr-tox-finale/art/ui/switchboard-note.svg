<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 70" width="520" height="70" role="img" aria-labelledby="switchboard-note-t switchboard-note-d">
<title id="switchboard-note-t">Switchboard: the letterer's margin note (blank)</title>
<desc id="switchboard-note-d">The letterer's note in the margin: a blue pencil italic HUB: and a long blue guideline for the tail count, written at run time, with a small tick box.</desc>
<line x1="10" y1="50" x2="510" y2="50" stroke="#8EC5E8" stroke-width="1.2"/>
<text x="14" y="44" font-size="26" font-family="serif" fill="#8EC5E8" text-anchor="start" font-style="italic" font-weight="bold">HUB:</text>
<rect x="480" y="20" width="24" height="24" fill="none" stroke="#8EC5E8" stroke-width="2"/>
<line x1="10" y1="60" x2="300" y2="60" stroke="#8EC5E8" stroke-width="0.6" opacity="0.6"/>
<circle cx="470" cy="32" r="2" fill="#8EC5E8"/>
</svg>
