<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="two-pans-t two-pans-d">
<title id="two-pans-t">Two Pans: Two-colour pulp, red and black</title>
<desc id="two-pans-d">Two Pans (1D): a beam balance drawn as the centrepiece of a two-colour pulp cover, red and black ink only on rough pulp stock with heavy black shadows and red flat fills. A BLACK pan and a RED pan hang from the beam; brass pip tokens stamped with dots wait in a tray. The dial at the top has a window marked on it, and a second band in a red caption box where his heart would hold. Nothing on the page names a substance; the unit is the pip.</desc>
