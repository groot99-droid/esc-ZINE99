<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="panes-t panes-d">
<title id="panes-t">Panes: Holographic foil trading card</title>
<desc id="panes-d">Panes (1D): a collectible trading card of Aegis, its face washed with rainbow holographic foil in diagonal bands, a bevelled frame and a stat box (LOAD, PANES). In the card's art window a breach in a wall of glass is being tiled with the seven tangram pieces of hard light, foil facets; six are set, and the seventh, the keystone, waits outside the outline in his hand. A gap the shape of it is left in the wall.</desc>
