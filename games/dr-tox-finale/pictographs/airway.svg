<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="airway-t airway-d">
<title id="airway-t">The airway: Non-photo-blue pencil roughs</title>
<desc id="airway-d">The airway (2D): the arcology's ducts as a page of non-photo-blue pencil roughs on bristol board: loose blue construction lines, a fan, louvred dampers and branch points sketched ahead. The duct behind Dr. Tox has been inked in black brush as he passed; the branch he did not take stays blue and fading. Airflow arrows carry him; his breath trails downstream as a soft grey wash, and below the duct floor a grille opens onto a room with names lettered under it. The Pulse line in the margin.</desc>
