<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="switchboard-t switchboard-d">
<title id="switchboard-t">Switchboard: Letterer's balloon page</title>
<desc id="switchboard-d">Switchboard (1D): a comic page at the lettering stage. Pencilled panel borders frame five districts (THE TOWERS, THE SUITES, THE ATRIUM, THE PLINTH, THE ROAD); above them inked speech balloons with hand-lettered capitals are the city's air circuits, AIR 1 to AIR 6 and the HUB, and each balloon's tail is a patch cord run to a panel. Two balloons lettered in red are the State's interlocks; THE PLINTH hangs on a tail from THE TOWERS. Blue guidelines run under every line of lettering, and a letterer's note in the margin counts the HUB's tails.</desc>
