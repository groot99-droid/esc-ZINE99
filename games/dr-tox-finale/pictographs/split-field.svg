<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="split-field-t split-field-d">
<title id="split-field-t">Split Field: Craftint Doubletone shading board</title>
<desc id="split-field-d">Split Field (1D): the station after, drawn on Craftint Doubletone board: black ink line, with grey single-line tone and crosshatch tone developed in brush-edged patches. Numbered marks on objects (a shield's face, a kiosk shutter, a ladder rail). At the centre a split-field comparison circle: the mark on the left half, a reference on the right, their striations lined up across a hairline. Three reference trays at the left (his plate, their hollow blade's twin channel, the State's shield rim); on the right a record strip naming who was hurt and by what, never a wound.</desc>
