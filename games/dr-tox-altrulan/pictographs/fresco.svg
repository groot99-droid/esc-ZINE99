<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="fresco-t fresco-d">
<title id="fresco-t">Fresco walk: Buon fresco on cracked plaster</title>
<desc id="fresco-d">Fresco walk (2D): a scripture wall in true fresco, earth pigments laid into wet lime plaster in daily patches whose seams still show. Painted left to right: the Suit-Demons on their Mountains, the Caged coming up out of the cave with amber in his arm, Aleglethan's halos round the Heart of the Mountain. Cracks branch through it; at one the plaster has flaked away and the old concrete beneath shows in cold grey with a painted line in a hand that is not scripture's (STAY OUTSIDE THE RING). The keeper walks a scaffold plank with a trowel and a pot, the day's plaster still wet ahead of her and a band of daylight moving along the wall: mend the crack while the patch is wet, or lean in and look.</desc>
