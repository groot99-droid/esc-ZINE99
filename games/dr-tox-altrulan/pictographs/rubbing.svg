<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="rubbing-t rubbing-d">
<title id="rubbing-t">Rubbing: Heelball brass rubbing</title>
<desc id="rubbing-d">Rubbing (1D): a sheet of white paper over the brass of the Twelve, weighted at its corners, and a block of black heelball wax. Where it has been rubbed the brass comes up black and every engraved line stays white: twelve standing figures in two rows, the tallest ringed with halos. The rest of the sheet is still blank paper with the faint shadow of the brass beneath. A corner turned back shows the brass's other face, an older plate whose raised letters RCC come up black where the wax has passed.</desc>
