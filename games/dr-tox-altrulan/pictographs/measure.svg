<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="measure-t measure-d">
<title id="measure-t">The Measure: Slip-glazed terracotta</title>
<desc id="measure-d">The Measure (1D): the keeper's vessels on a terracotta floor, all slip-glazed: a cup of three, a jug of five and a jar of eight lulls (an invented unit), unmarked, cream slip over red clay with sgraffito lines scratched through. An amber pour runs from the jug into the cup. In front, a pilgrim's bowl whose target is four, shown as four incised strokes. To one side the open Toad the store is poured from, and set apart under its corded seal, the Last Toad; at the other, the Ghost's white flask with its glaze line, never used for the sacrament. Above, the pours so far are scratched as a row of tallies, and a crossed tally for each lull poured to the earth.</desc>
