<title id="ground-altar-t">Fabric ground: the edge of the circle</title>
<desc id="ground-altar-d">The ritual-room floor in near dark: the edge of the circle of torn fabric skins as an arc of faded cloth scraps lying edge to edge, the place for twelve stitches pricked along it, and the room's red warmth beyond.</desc>
