<title id="ground-own-felt-t">Fabric ground: your own seam</title>
<desc id="ground-own-felt-d">Your own cream felt seen at arm's length under a low lamp: one seam running across it, held shut with six pins and still unsewn, a warmth showing along it from underneath.</desc>
