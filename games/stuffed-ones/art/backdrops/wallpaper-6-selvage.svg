<title id="wallpaper-6-selvage-t">Wallpaper repeat: the paper with the glyphs</title>
<desc id="wallpaper-6-selvage-d">A woven wallpaper repeat from deep in the labyrinth: a blue damask where each flower has been replaced by one of the book's glyphs, couched in bone thread.</desc>
