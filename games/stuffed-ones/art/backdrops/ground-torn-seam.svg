<title id="ground-torn-seam-t">Fabric ground: a friend's torn seam</title>
<desc id="ground-torn-seam-d">Rust felt filling the view at dawn: a ragged tear across it drawn as nothing but its two frayed lips and the shadow between, loose thread ends, and cold window light coming up from the right.</desc>
