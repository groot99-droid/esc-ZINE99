<title id="thread-own-t">A small felt cat with button eyes</title>
<desc id="thread-own-d">A small cream felt cat with button eyes sitting on the third stair, where nobody left it: cut felt on night-blue felt, whip-stitched, with its own faint warmth on the tread beneath it.</desc>
