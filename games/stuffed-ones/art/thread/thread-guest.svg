<title id="thread-guest-t">A knock answered through a wall</title>
<desc id="thread-guest-d">A wall seen at the cut, as the dollhouse shows its walls: wallpaper either side, and on each face three small knuckle marks with rings of running stitch spreading from them, the three on the right answering the three on the left a little later and a little lower.</desc>
