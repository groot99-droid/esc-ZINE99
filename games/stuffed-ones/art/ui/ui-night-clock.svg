<title id="ui-night-clock-t">The night clock</title>
<desc id="ui-night-clock-d">The dollhouse night clock, 23:00 to 05:00, as a ruled lithograph scale: the hours past are hatched in night blue and a small amber lamp marks the present hour.</desc>
