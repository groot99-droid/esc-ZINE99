<title id="page-yours-t">Your page: a page with no front</title>
<desc id="page-yours-d">A new linen page for the hand-sewn book with no front: six empty places along a red-wool rule, each with room for the sewer's strokes above it, and a needle and a slack bone thread lying across the corner.</desc>
