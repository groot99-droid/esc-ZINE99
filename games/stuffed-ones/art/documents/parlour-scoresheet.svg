<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" role="img" aria-labelledby="parlour-scoresheet-t parlour-scoresheet-d">
<title id="parlour-scoresheet-t">The scoresheet</title>
<desc id="parlour-scoresheet-d">The guests' scoresheet for the counting game, kept in one neat hand: three columns of words said and spaces reached, a Knot that sent a peg back three, and a pencilled question mark where a peg is not where the sheet says it should be.</desc>
