<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="eye-at-own-rose-t eye-at-own-rose-d">
<title id="eye-at-own-rose-t">An eye at your own rose, from the passage side</title>
<desc id="eye-at-own-rose-d">An eye pressed close to the other side of the lens, in gouache: lamplit skin, the iris dark, a lash line, no face beyond it. Painted on transparent ground for the eye at the hole to draw over the passage.</desc>
