<title id="back-hotel-t">Deco deck: the hotel's own back</title>
<desc id="back-hotel-d">The back of the office's own deck: gold on deep green, a stepped fan rising from the foot of the card, a second one hanging from the head, and a small brass rose where they meet.</desc>
