<title id="slip-10-t">Slipped card 10 (night 6)</title>
<desc id="slip-10-d">Slipped card 10, found on night 6: the 4 of spades from another, river-grey deck, its face written across in blue-black ink: "Wren's account ends in the time I knock." A small ink drawing sits under the words.</desc>
