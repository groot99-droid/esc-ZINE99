<title id="slip-12-t">Slipped card 12 (night 7)</title>
<desc id="slip-12-d">Slipped card 12, found on night 7: the king of hearts from another, river-grey deck, its face written across in blue-black ink: "I stopped writing it down. They didn't stop me." A small ink drawing sits under the words.</desc>
