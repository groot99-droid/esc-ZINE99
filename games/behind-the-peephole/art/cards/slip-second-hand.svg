<title id="slip-second-hand-t">A slipped card from the second hand, face down</title>
<desc id="slip-second-hand-d">A slipped card lying face down on the baize, its rose back whole, one corner lifted to show a line of ink on the face: a card from the second hand, told from Fenn's only by the petal that is not nicked.</desc>
