<title id="slip-09-t">Slipped card 9 (night 6)</title>
<desc id="slip-09-d">Slipped card 9, found on night 6: the 7 of hearts from another, river-grey deck, its face written across in blue-black ink: "Back office safe: the year they built the passage, then the minute I knock." A small ink drawing sits under the words.</desc>
