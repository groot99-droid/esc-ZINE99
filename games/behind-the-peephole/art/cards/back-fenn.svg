<title id="back-fenn-t">Another deck: the rose back with a nicked petal</title>
<desc id="back-fenn-d">The back of the other deck, river grey with a lozenge ground and a pale eight-petalled rose; one petal, upper right, has a small nick cut out of it. Fenn's cards.</desc>
