<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" role="img" aria-labelledby="lens-own-door-t lens-own-door-d">
<title id="lens-own-door-t">Your own rose, from inside: the passage at 2:14</title>
<desc id="lens-own-door-d">The view out through the lens in your own office door, fitted backwards: the valet passage bowed into a fisheye circle, six brass roses glowing down its length, the far stair end dark, and nearer than all of them a shape in a raincoat standing at the door. Paint edges only, no line.</desc>
