<title id="gap-403-t">Gap strip, 403: the case on its edge</title>
<desc id="gap-403-d">The gap under 403's valet door: the desk's legs, the flat case stood on its edge with brass corners, boots rimed with salt and a jar of paint water, under a north-light bulb.</desc>
