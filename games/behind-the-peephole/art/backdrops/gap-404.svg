<title id="gap-404-t">Gap strip, 404: a miniature under the bed</title>
<desc id="gap-404-d">The gap under 404's valet door: a miniature bottle rolled under the bed, a waiter's black shoes, one on its side, and a white catering jacket flecked with gold on the floor in yellow light.</desc>
