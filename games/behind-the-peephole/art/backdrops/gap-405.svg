<title id="gap-405-t">Gap strip, 405: cables and cereal</title>
<desc id="gap-405-d">The gap under 405's valet door: cables across the carpet, one bag holding three laptops, a cereal box with a spill beside it, and two socked feet in the glow of a screen.</desc>
