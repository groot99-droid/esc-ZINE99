<title id="gap-406-t">Gap strip, 406: two pairs of feet</title>
<desc id="gap-406-d">The gap under 406's valet door on night four: two pairs of feet where two people sit on the floor, a photograph lying between them, the coil of blue rope and a fallen paper boat in red-shaded light.</desc>
