<title id="gap-401-t">Gap strip, 401: boots, red clay on the welt</title>
<desc id="gap-401-d">The gap under 401's valet door: the bedspread's folded hem, the legs of an ironing board, a pair of boots set side by side with red clay on the welts, and the kit bag, in white lamplight.</desc>
