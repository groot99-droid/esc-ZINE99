<title id="gap-402-t">Gap strip, 402: an envelope under the main door</title>
<desc id="gap-402-d">The gap under 402's valet door: a cream envelope pushed under the main door, a ball of wool rolled from the armchair, two court shoes toe to toe, and the television's blue on the carpet.</desc>
