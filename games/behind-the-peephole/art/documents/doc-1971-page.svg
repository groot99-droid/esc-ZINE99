<title id="doc-1971-page-t">The 1971 page: a statement form signed by H. Wren, night auditor</title>
<desc id="doc-1971-page-d">A yellowed statement form from 1971 found behind the booking ledger: six rooms and their returns typed on an older machine, a seventh line under them reading 400 and witness, signed H. Wren, night auditor; one row struck through in another hand with a single word written over it.</desc>
