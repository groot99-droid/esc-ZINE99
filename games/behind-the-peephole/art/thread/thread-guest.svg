<title id="thread-guest-t">Thread: a name written on the inside of a thing</title>
<desc id="thread-guest-d">The collection's hidden object for this game, in gouache: one of Mara's white cotton gloves on the desk under the north-light bulb, its cuff turned back, and inside the cuff a name in small ink capitals where only its wearer would read it.</desc>
