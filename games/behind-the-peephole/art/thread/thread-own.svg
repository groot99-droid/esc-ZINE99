<title id="thread-own-t">Thread: a clock stopped at 2:14</title>
<desc id="thread-own-d">This game's thread object in gouache: a small travelling alarm clock on the office desk under the green-shaded lamp, stopped at fourteen minutes past two, with three chalk knock marks on the wood beside it, two close and one apart.</desc>
