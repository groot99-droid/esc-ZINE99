<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="lock-lever-t lock-lever-d">
<title id="lock-lever-t">Lock plate: your own door, two levers, worked from the wrong side</title>
<desc id="lock-lever-d">Patent plate of the lever lock in the office door: the case opened, two levers lifted toward the gate while the bolt is thrown, the key drawn apart on its axis, and above the keyhole the brass rose, which goes dark when someone looks in.</desc>
