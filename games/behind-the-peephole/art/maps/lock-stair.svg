<title id="lock-stair-t">Lock plate: the stair door, five pins, two spools</title>
<desc id="lock-stair-d">Patent plate of the stair door's five-pin tumbler with two spool pins, exploded and numbered, with an end view of the plug turned five degrees into a false set.</desc>
