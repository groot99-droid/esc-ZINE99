<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="lock-safe-t lock-safe-d">
<title id="lock-safe-t">Lock plate: the back-office safe, three wheels</title>
<desc id="lock-safe-d">Patent plate of the back-office safe: the numbered dial, spindle and three gated wheels drawn apart on one dotted axis, the fence above waiting for the gates, and a strip of graph paper plotting the contact points.</desc>
