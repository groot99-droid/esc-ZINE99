<title id="lock-drawer-t">Lock plate: the desk drawer, three pins</title>
<desc id="lock-drawer-d">Patent plate of the desk drawer's three-pin tumbler, pulled apart along dotted axes: shell, springs, driver and key pins, plug, the hook pick under the first binding pin, and the drawer front with its escutcheon.</desc>
