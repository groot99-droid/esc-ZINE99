<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="lock-wafer-t lock-wafer-d">
<title id="lock-wafer-t">Lock plate: lost property, five wafers and the jiggler ring</title>
<desc id="lock-wafer-d">Patent plate of the lost-property cabinet's wafer lock: five flat wafers drawn out of the plug at their depths, a ring of eight jiggler keys fanned beside it, and a blank with a file.</desc>
