<title id="ui-catch-ring-closing-t">Catch ring: a third closed</title>
<desc id="ui-catch-ring-closing-d">The catch ring a third of the way round the lens: a brass escutcheon on dark varnish, black glass, the dotted inner half where a beat must sit, and an amber arc beginning to close.</desc>
