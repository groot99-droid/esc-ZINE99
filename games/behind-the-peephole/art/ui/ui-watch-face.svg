<title id="ui-watch-face-t">The pocket watch: the time, and minutes since the last bell</title>
<desc id="ui-watch-face-d">The pocket watch raised with Tab: a brass case and cream dial with deco numerals at the quarters, hands at fourteen minutes past two, and a second small dial that counts the minutes since the last bell.</desc>
