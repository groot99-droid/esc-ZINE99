<title id="ui-number-plates-t">Brass number plates, 401 to 406</title>
<desc id="ui-number-plates-d">Six small brass door plates, 401 to 406, screwed to dark varnish, each thumb-polished at its centre and lit from below by its own room's colour of lamp.</desc>
