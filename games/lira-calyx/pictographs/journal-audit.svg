<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="journal-audit-t journal-audit-d">
<title id="journal-audit-t">Journal Audit: Redacted dossier</title>
<desc id="journal-audit-d">Journal Audit (1D): a page of Lira's field log lies in a dossier, with black bars where it was redacted. Each line is being marked as hers, forged, or another hand: seal-red FORGED stamps sit on two lines, a small slanted note in the archivist's blue ink corrects a third, and the loupe shows that a forged line writes "deg" where Lira writes the degree sign. A tally counts the lines checked.</desc>
