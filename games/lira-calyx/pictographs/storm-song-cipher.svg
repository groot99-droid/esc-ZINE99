<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="storm-song-cipher-t storm-song-cipher-d">
<title id="storm-song-cipher-t">Storm-Song Cipher: Neume chant notation</title>
<desc id="storm-song-cipher-d">Storm-Song Cipher (1D): Mara's song in square neumes on a red four-line staff, above the player's own transcription in pencil with the next note waiting at the cursor. Under each neume its interval is read as a bearing, 30 degrees a step, and each rest as 100 m; a breath mark ends the phrase. On the right the decoded bearings and distances are plotted as a pencil path across the peak map, ending on the ring of a located node.</desc>
