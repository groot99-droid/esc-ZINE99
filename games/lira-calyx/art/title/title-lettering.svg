<title id="title-lettering-t">Title lettering</title>
<desc id="title-lettering-d">The title in iron-gall ink on laid paper, between pencil guide lines; the black bar that covered the word Redacted is caught half lifted, hinged at its left end, its shadow still on the word.</desc>
