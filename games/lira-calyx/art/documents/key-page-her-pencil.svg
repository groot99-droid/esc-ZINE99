<title id="key-page-her-pencil-t">The Key: her pencil</title>
<desc id="key-page-her-pencil-d">The same printed page after Book I: Lira's pencil has bracketed the Ember Wolf couplet and written a new branch beside it, found above 2 000 m, with a pup sketched in the margin, its altitude tag, and the open triangle that marks her hand.</desc>
