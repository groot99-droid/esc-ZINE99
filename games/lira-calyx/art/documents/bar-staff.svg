<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="bar-staff-t bar-staff-d">
<title id="bar-staff-t">The bar staff</title>
<desc id="bar-staff-d">The bar staff: a page of the redacted brief slid under a strip of horn ruled with four red lines, so that each surgical bar sits on a line like a neume; above the strip its pitch is pencilled as a square, and a ruler of rests runs along the foot. The brushed bar falls between lines and reads as nothing.</desc>
