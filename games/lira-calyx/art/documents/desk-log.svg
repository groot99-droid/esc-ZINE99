<title id="desk-log-t">The archivist's desk log</title>
<desc id="desk-log-d">A clerk's desk log on grey ruled stock: dated entries in the small blue-black hand, one per ruled bar, each with the bar drawn to its length beside it; the last line left blank and dated.</desc>
