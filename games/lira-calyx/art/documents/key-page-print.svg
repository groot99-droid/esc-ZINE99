<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" role="img" aria-labelledby="key-page-print-t key-page-print-d">
<title id="key-page-print-t">The Key: the printed page</title>
<desc id="key-page-print-d">A page of the printed dichotomous key: numbered couplets in serif type, each with the small block that marks a printed hand, the first couplet on glow period legible, species names at the ends of dotted leaders, a branching diagram of the key and an engraved Aether-Vine sprig.</desc>
