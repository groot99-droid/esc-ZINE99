<title id="pell-page-3-t">Pell's book, page 3</title>
<desc id="pell-page-3-d">Pell's copy of the valley reading: three posts and the pulse crossing them as wavy lines, one in cyan, and under it the doctor's 0.44, written the same.</desc>
