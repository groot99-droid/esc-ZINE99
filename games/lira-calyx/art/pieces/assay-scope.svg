<title id="assay-scope-t">The scope</title>
<desc id="assay-scope-d">The oscilloscope on the bench: a slate case with a round-cornered screen, a phosphor-green spectrum on the graticule with the cursor set on its tallest peak, three knobs, and a paper tag tied to the handle in Lira's figures: 452 nm.</desc>
