<text x="100" y="136" font-size="92" font-family="serif" fill="#3b2618" stroke="#3b2618" stroke-width="1.1" filter="url(#lettering-fire-rough5)" font-style="italic" textLength="158.2" lengthAdjust="spacingAndGlyphs">Fire</text>
<text x="104" y="180" font-size="22" font-family="serif" font-style="italic" fill="#7d7a74" transform="rotate(-0.3 104 180)">silent water lifts, the river still glowing</text>
