<line x1="40" y1="57.8" x2="1160" y2="58.9" stroke="#7d7a74" stroke-width="0.7" opacity="0.5"/>
<line x1="40" y1="137.7" x2="1160" y2="137.9" stroke="#7d7a74" stroke-width="0.7" opacity="0.5"/>
