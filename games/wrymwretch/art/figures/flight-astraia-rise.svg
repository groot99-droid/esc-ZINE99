<title id="flight-astraia-rise-t">Astraia: wing up</title>
<desc id="flight-astraia-rise-d">Astraia, the Celestial tribe's dragon, in a few sumi strokes on silk with Seraphyne riding: the wings at the top of a beat, climbing.</desc>
