<title id="flight-astraia-beat-t">Astraia: wing down</title>
<desc id="flight-astraia-beat-d">Astraia, the Celestial tribe's dragon, in a few sumi strokes on silk with Seraphyne riding: the wings swept down under the body.</desc>
