<title id="realms-piece-earth-t">Six Realms piece: Earth</title>
<desc id="realms-piece-earth-d">Six Realms piece in tesserae on a gold ground: the Earth tribe, its emblem laid in pale stone on South colour, outlined by one course of near-black tesserae and filled in courses that follow the outline (redrawn 2026-11-16 to read at tessera scale), bone-white rim. Moves 1; safe at home; raises a Stone.</desc>
