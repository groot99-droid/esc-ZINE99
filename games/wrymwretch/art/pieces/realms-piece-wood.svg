<title id="realms-piece-wood-t">Six Realms piece: Wood</title>
<desc id="realms-piece-wood-d">Six Realms piece in tesserae on a gold ground: the Wood tribe, its emblem laid in pale stone on West colour, outlined by one course of near-black tesserae and filled in courses that follow the outline (redrawn 2026-11-16 to read at tessera scale), bone-white rim. Moves 1 hex; leaves a Grove.</desc>
