<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="realms-piece-sky-t realms-piece-sky-d">
<title id="realms-piece-sky-t">Six Realms piece: Sky</title>
<desc id="realms-piece-sky-d">Six Realms piece in tesserae on a gold ground: the Sky tribe, its emblem laid in pale stone on North colour, outlined by one course of near-black tesserae and filled in courses that follow the outline (redrawn 2026-11-16 to read at tessera scale), bone-white rim. Up to 3 in a line, jumping.</desc>
