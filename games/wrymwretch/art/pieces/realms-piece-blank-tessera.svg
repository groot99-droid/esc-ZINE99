<title id="realms-piece-blank-tessera-t">Six Realms piece: the blank tessera</title>
<desc id="realms-piece-blank-tessera-d">The blank tessera, the Remnants' neutral piece: one large unlaid tile, bone-grey and cracked, with no emblem. The gold ground round it has gone dull, as pieces beside it lose their powers.</desc>
