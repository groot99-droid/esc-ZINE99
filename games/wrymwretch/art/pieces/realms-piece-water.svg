<title id="realms-piece-water-t">Six Realms piece: Water</title>
<desc id="realms-piece-water-d">Six Realms piece in tesserae on a gold ground: the Water tribe, its emblem laid in pale stone on East colour, outlined by one course of near-black tesserae and filled in courses that follow the outline (redrawn 2026-11-16 to read at tessera scale), bone-white rim. Up to 2; may push a piece.</desc>
