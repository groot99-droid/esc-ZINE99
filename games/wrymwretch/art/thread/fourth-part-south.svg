<title id="fourth-part-south-t">The fourth row: a vein in the Heartstone</title>
<desc id="fourth-part-south-d">One of the fourth row's six still parts, where it was noticed: a vein in the Heartstone. The place in the reliquary hand, the glyph part it keeps lit in gold, a carved silver frame with a South accent.</desc>
