<title id="thread-own-t">Thread: a name on the inside of a mask</title>
<desc id="thread-own-d">This game's thread object: a Remnant's blank mask lying face down, seen from the inside, where only its wearer could read the name scratched into the bone: Dorrin Vael.</desc>
