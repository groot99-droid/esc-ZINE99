<title id="fourth-part-below-t">The fourth row: a candle shadow in the forbidden chamber</title>
<desc id="fourth-part-below-d">One of the fourth row's six still parts, where it was noticed: a candle shadow in the forbidden chamber. The place in the reliquary hand, the glyph part it keeps lit in gold, a carved silver frame with a Below accent.</desc>
