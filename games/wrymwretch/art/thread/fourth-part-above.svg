<title id="fourth-part-above-t">The fourth row: a star in the Priory dome</title>
<desc id="fourth-part-above-d">One of the fourth row's six still parts, where it was noticed: a star in the Priory dome. The place in the reliquary hand, the glyph part it keeps lit in gold, a carved silver frame with a Above accent.</desc>
