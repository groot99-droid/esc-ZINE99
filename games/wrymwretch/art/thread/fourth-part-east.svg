<title id="fourth-part-east-t">The fourth row: a kelp line on the seabed</title>
<desc id="fourth-part-east-d">One of the fourth row's six still parts, where it was noticed: a kelp line on the seabed. The place in the reliquary hand, the glyph part it keeps lit in gold, a carved silver frame with a East accent.</desc>
