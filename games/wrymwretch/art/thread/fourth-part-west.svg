<title id="fourth-part-west-t">The fourth row: the crack in the split tree</title>
<desc id="fourth-part-west-d">One of the fourth row's six still parts, where it was noticed: the crack in the split tree. The place in the reliquary hand, the glyph part it keeps lit in gold, a carved silver frame with a West accent.</desc>
