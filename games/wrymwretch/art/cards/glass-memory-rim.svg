<title id="glass-memory-rim-t">Ilvarra's memory: The Rim</title>
<desc id="glass-memory-rim-d">Concentration card in stained glass, one of Ilvarra's memories: the Rim of Wrymreach: two cliffs, the wound between them, her fire and the tents, sun and moon above.</desc>
