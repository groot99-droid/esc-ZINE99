<title id="glass-whisperfox-t">Whisperfox</title>
<desc id="glass-whisperfox-d">Concentration card in stained glass, lead-lined jewel colours of the West: the Whisperfox. A small grey fox that speaks with the voices of people it has heard, and no longer knows its own.</desc>
