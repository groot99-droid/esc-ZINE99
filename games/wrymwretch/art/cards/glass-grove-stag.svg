<title id="glass-grove-stag-t">Grove Stag</title>
<desc id="glass-grove-stag-d">Concentration card in stained glass, lead-lined jewel colours of the West: the Grove Stag. A silver-antlered stag of the western groves; its prints glow where the moss is still whole.</desc>
