<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-labelledby="doc-who-next-t doc-who-next-d">
<title id="doc-who-next-t">The Record's last page: Who next?</title>
<desc id="doc-who-next-d">The Record's final page, as The Empty Saddle ends: an ivory leaf in a silver binding, headed WHO NEXT? in carved capitals, its ruled lines empty; one crack runs down from the heading, and a single sun-gold and moon-silver stud marks the place. It is shown on a later run, when the notebook is opened.</desc>
