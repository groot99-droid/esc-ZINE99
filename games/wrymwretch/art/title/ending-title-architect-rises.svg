<title id="ending-title-architect-rises-t">Ending lettering: The Architect Rises</title>
<desc id="ending-title-architect-rises-d">The ending's name, THE ARCHITECT RISES, in cracked bone capitals edged with tarnished silver, over the void with one glow of its accent; a silver rule under it with one accent stud. Lettering for the ending card.</desc>
