<title id="ending-title-the-empty-saddle-t">Ending lettering: The Empty Saddle</title>
<desc id="ending-title-the-empty-saddle-d">The ending's name, THE EMPTY SADDLE, in cracked bone capitals edged with tarnished silver, over the void with one glow of its accent; a silver rule under it with one accent stud. Lettering for the ending card.</desc>
