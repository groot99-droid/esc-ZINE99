<title id="ending-title-dormant-again-t">Ending lettering: Dormant Again</title>
<desc id="ending-title-dormant-again-d">The ending's name, DORMANT AGAIN, in cracked bone capitals edged with tarnished silver, over the void with one glow of its accent; a silver rule under it with one accent stud. Lettering for the ending card.</desc>
