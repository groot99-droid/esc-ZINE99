<title id="ending-title-the-rememberer-t">Ending lettering: The Rememberer</title>
<desc id="ending-title-the-rememberer-d">The ending's name, THE REMEMBERER, in cracked bone capitals edged with tarnished silver, over the void with one glow of its accent; a silver rule under it with one accent stud. Lettering for the ending card.</desc>
