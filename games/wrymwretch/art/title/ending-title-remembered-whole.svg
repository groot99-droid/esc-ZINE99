<title id="ending-title-remembered-whole-t">Ending lettering: Remembered Whole</title>
<desc id="ending-title-remembered-whole-d">The ending's name, REMEMBERED WHOLE, in cracked bone capitals edged with tarnished silver, over the void with one glow of its accent; a silver rule under it with one accent stud. Lettering for the ending card.</desc>
