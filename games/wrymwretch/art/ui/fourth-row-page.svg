<title id="fourth-row-page-t">The notebook: the fourth row (page head)</title>
<desc id="fourth-row-page-d">The notebook's page head for the fourth row: THE FOURTH ROW cut in bone capitals over a carved band of six empty sockets, one in each realm's colour, joined by a crack. The four glyph parts it will hold are cut faintly in the band.</desc>
