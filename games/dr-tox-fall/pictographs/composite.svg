<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="composite-t composite-d">
<title id="composite-t">Composite: Identikit acetate overlays</title>
<desc id="composite-d">Composite (1D): a witness-room identikit, line-drawn feature strips on clear acetate sheets stacked over a pale form. Each strip is a region of the body (head and jaw, shoulders, arms, back, gait) and carries the grease-pencil numbers of the witnesses who saw it. The stack shows the constants the bible fixes (black veins, green eyes, a jaw past the skull) and one strip, a pair of wings with a halo, offered by a witness who saw a god, sits askew and does not fit. Witness cards run along the bottom; nothing shows the act, only the shape.</desc>
