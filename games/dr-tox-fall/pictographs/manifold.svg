<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="manifold-t manifold-d">
<title id="manifold-t">The Manifold: Mail-order comic advert</title>
<desc id="manifold-d">The Manifold (1D): the gauntlet drawn as a back-page mail-order comic advert, with a shouting headline, numbered callouts and a dashed clip-out coupon border. The shunt feeds a clear line into a manifold of valves along the gauntlet's spine; the player turns the valves to route the flow to four glass barrels, each wanting its share. A fifth outlet at the end is capped. A small coupon corner shows the Pulse each dart will cost with this routing.</desc>
<rect x="0" y="0" width="1200" height="800" fill="#f4ecd2"/>
<rect x="20" y="20" width="1160" height="760" fill="none" stroke="#141414" stroke-width="4" stroke-dasharray="16 10"/>
<text x="60" y="104" font-size="50" font-family="sans-serif" fill="#B3261E" font-weight="bold">AMAZING! FOUR BARRELS FROM ONE LINE!</text>
<text x="60" y="146" font-size="24" font-family="serif" fill="#141414" font-style="italic">Route it yourself. Every valve a choice. Satisfaction not guaranteed.</text>
