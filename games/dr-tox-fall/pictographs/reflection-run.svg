<title id="reflection-run-t">Reflection run: Silkscreen pop-art repeats</title>
<desc id="reflection-run-d">Reflection run (2D): a Spire glass hall drawn as a silkscreen print of repeated frames, flat blocks of colour slightly off register. Cally walks left to right along the floor line; below it, in the glass, her reflection walks upside down, mirrored. The same frame repeats along the row, the colours shifting from print to print; in one repeat the reflection has stopped at a door and turned its back while Cally walks on, the frame that does not match.</desc>
