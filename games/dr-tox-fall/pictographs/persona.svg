<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="persona-t persona-d">
<title id="persona-t">Persona: 1950s romance comic</title>
<desc id="persona-d">Persona (1D): a page from a 1950s romance comic in pastel flats with no dot screen. In a heart-shaped panel at the top a profile of a young man's face, his attachment signature written beside it in thought balloons: a painted sky, a string, four children, warm amber light. Below, a hand of romance-comic cards Cally plays to fit it, each a gesture or a line; a match meter fills toward 94.6. One card at the end of the hand was dealt by the deck itself, a dropped blade, and it does not fit.</desc>
