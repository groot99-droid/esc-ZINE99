<title id="crowd-thread-security-t">Spire security with an earpiece</title>
<desc id="crowd-thread-security-d">Spire security: a broad figure in a fitted jacket, a coiled earpiece wire down the neck, hands clasped in front; densely hatched, a little cleaner-lined than everyone else.</desc>
