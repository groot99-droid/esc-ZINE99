<title id="crowd-thread-tox-turn-t">Dr. Tox turned sideways (narrowing the ring)</title>
<desc id="crowd-thread-tox-turn-d">Dr. Tox turned sideways to slip a gap, shoulders in, the shroud pulled tight: thinner than a person should be, a hand holding the cloth closed at the chest.</desc>
