<title id="crowd-thread-queue-1-t">Queue: a woman with a bucket</title>
<desc id="crowd-thread-queue-1-d">A tired woman in the relief-hall queue in lumpy crosshatched pen, a bucket hanging from one hand, a few stippled plague marks at the neck; she is someone, and becomes a card if she enters the ring.</desc>
