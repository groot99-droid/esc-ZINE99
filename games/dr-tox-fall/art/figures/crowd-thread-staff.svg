<title id="crowd-thread-staff-t">Relief staff with a baton</title>
<desc id="crowd-thread-staff-d">One of the State's relief staff at the shutter: a peaked cap, a stiff coat, a baton held across the body and an armband lettered RCC; blocky where the queue is lumpy.</desc>
