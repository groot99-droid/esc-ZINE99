<title id="crowd-thread-tox-walk-t">Dr. Tox walking, shroud open</title>
<desc id="crowd-thread-tox-walk-d">Dr. Tox side-on in heavy pen, hood up, the heavy desaturated green shroud hanging open from the shoulders and crosshatched, the narrow dark figure showing down the front: narrow, vertical, contained.</desc>
