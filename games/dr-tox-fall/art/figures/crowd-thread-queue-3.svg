<title id="crowd-thread-queue-3-t">Queue: an elder wrapped in a blanket</title>
<desc id="crowd-thread-queue-3-d">An old person wrapped to the chin in a blanket with a stitched hem, lumpy and small, the blanket crosshatched in a different direction from the coat beneath.</desc>
