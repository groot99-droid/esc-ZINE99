<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="crowd-thread-kitchen-staff-t crowd-thread-kitchen-staff-d">
<title id="crowd-thread-kitchen-staff-t">Ama Owusu and Lev Brandt at the service door</title>
<desc id="crowd-thread-kitchen-staff-d">Ama Owusu and Lev Brandt, plague-marked kitchen staff on day passes, in white aprons over their coats, one holding the service door's bar down: two people, not a crowd.</desc>
