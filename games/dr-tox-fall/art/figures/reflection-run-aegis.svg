<title id="reflection-run-aegis-t">Aegis across the glass</title>
<desc id="reflection-run-aegis-d">Aegis across two panes of glass, seen only as a broad flat silhouette in warm gold under an ink pass, head turning; he has no design system yet, so he is a shape and a colour.</desc>
