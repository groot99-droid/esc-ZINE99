<title id="crowd-thread-tox-dart-t">Dr. Tox throwing a dart (chapter 11)</title>
<desc id="crowd-thread-tox-dart-d">Dr. Tox with one arm out of the shroud, the black gauntlet's four exposed barrels along the forearm and a clear line at the wrist, a dart just leaving the fingers in a short ink streak.</desc>
