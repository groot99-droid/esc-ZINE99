<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="ending-first-word-t ending-first-word-d">
<title id="ending-first-word-t">Ending: First Word</title>
<desc id="ending-first-word-d">Ending lettering plate for First Word, a proposal (none of Fall's endings is as written): the ending's last image small and still on the left, its name in pale capitals on the right, one line for each lead's state (Dr. Tox, Reese, Cally), and the cost below.</desc>
