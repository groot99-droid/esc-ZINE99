<title id="ending-the-following-t">Ending: The Following</title>
<desc id="ending-the-following-d">Ending lettering plate for The Following, a proposal (none of Fall's endings is as written): the ending's last image small and still on the left, its name in pale capitals on the right, one line for each lead's state (Dr. Tox, Reese, Cally), and the cost below.</desc>
