<rect x="80" y="456" width="70" height="18" rx="8" fill="#efe9da"/>
<line x1="96" y1="506" x2="96" y2="560" stroke="#3a3f40" stroke-width="6"/>
<line x1="364" y1="506" x2="364" y2="560" stroke="#3a3f40" stroke-width="6"/>
<rect x="40" y="40" width="520" height="595" fill="none" stroke="#2f3a3b" stroke-width="3"/>
<text x="610" y="110" font-size="22" font-family="sans-serif" fill="#C4CDCB" text-anchor="start" letter-spacing="8">ENDING</text>
<text x="606" y="200" font-size="66" font-family="sans-serif" fill="#E9ECEA" text-anchor="start" font-weight="bold" letter-spacing="2">THE CLINIC</text>
<text x="608" y="268" font-size="16" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">DR. TOX</text>
<text x="712" y="268" font-size="21" font-family="serif" fill="#C4CDCB" text-anchor="start">a clinic nobody stays in.</text>
<text x="608" y="312" font-size="16" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">REESE</text>
<text x="712" y="312" font-size="21" font-family="serif" fill="#C4CDCB" text-anchor="start">held the wall; walked the other way.</text>
<text x="608" y="356" font-size="16" font-family="sans-serif" fill="#F2C14E" text-anchor="start" font-weight="bold" letter-spacing="3">CALLY</text>
<text x="712" y="356" font-size="21" font-family="serif" fill="#C4CDCB" text-anchor="start">reassigned; the variance logged.</text>
<line x1="608" y1="470" x2="1150" y2="470" stroke="#2f3a3b" stroke-width="2"/>
<text x="608" y="506" font-size="16" font-family="sans-serif" fill="#8A9A99" text-anchor="start" letter-spacing="5">THE COST</text>
<text x="608" y="544" font-size="22" font-family="serif" fill="#E9ECEA" text-anchor="start">The bloom takes the settlement under the freeway.</text>
