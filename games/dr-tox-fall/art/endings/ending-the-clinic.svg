<path d="M383.7,216 L396.3,216 L397.7,230 L394.2,235.6 L406.8,244 L405.4,272 L399.8,300 L392.1,300 L390,274.8 L387.9,300 L380.2,300 L374.6,272 L373.2,244 L385.8,235.6 L382.3,230Z" fill="#0d1112"/>
