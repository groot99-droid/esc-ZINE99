<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 160" width="256" height="160" role="img" aria-labelledby="composite-witness-wren-t composite-witness-wren-d">
<title id="composite-witness-wren-t">Witness 2: Wren Halloran</title>
<desc id="composite-witness-wren-d">Witness card 2 for Composite 1: Wren Halloran, who saw from at the shelter door; a typed index card with the witness number circled in red grease pencil. The account is read aloud at run time.</desc>
<defs><filter id="composite-witness-wren-rough1"><feTurbulence type="turbulence" baseFrequency="0.1" numOctaves="2" seed="781" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.2"/></filter></defs>
<rect x="6" y="8" width="250" height="150" rx="4" fill="#000" opacity="0.1"/>
<rect x="2" y="2" width="250" height="150" rx="4" fill="#fbfbf6" stroke="#8f958f" stroke-width="2"/>
<line x1="2" y1="40" x2="252" y2="40" stroke="#c7a0a0" stroke-width="1.2"/>
<line x1="14" y1="70" x2="240" y2="70" stroke="#b9c7cf" stroke-width="1"/>
<line x1="14" y1="96" x2="240" y2="96" stroke="#b9c7cf" stroke-width="1"/>
<line x1="14" y1="122" x2="240" y2="122" stroke="#b9c7cf" stroke-width="1"/>
<circle cx="32" cy="30" r="20" fill="none" stroke="#b03030" stroke-width="3.5" filter="url(#composite-witness-wren-rough1)"/>
<text x="32" y="40" font-size="28" font-family="sans-serif" fill="#b03030" text-anchor="middle" font-weight="bold">2</text>
<text x="62" y="32" font-size="19" font-family="monospace" fill="#2a3340" text-anchor="start" font-weight="bold">Wren Halloran</text>
<text x="14" y="64" font-size="11" font-family="monospace" fill="#666" text-anchor="start">SAW FROM:</text>
<text x="14" y="90" font-size="15" font-family="monospace" fill="#2a3340" text-anchor="start">at the shelter door</text>
<text x="240" y="146" font-size="10" font-family="monospace" fill="#888" text-anchor="end">COMPOSITE 1</text>
</svg>
