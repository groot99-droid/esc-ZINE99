<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="1000" height="90" role="img" aria-labelledby="persona-meter-t persona-meter-d">
<title id="persona-meter-t">The match meter, marked at 94.6</title>
<desc id="persona-meter-d">The match meter along the bottom of the page: a long rounded plum-edged track with hearts at each end, empty for the fill, and a firm plum mark at 94.6 with the number lettered above it.</desc>
<rect x="60" y="40" width="880" height="34" rx="17" fill="#ffffff" stroke="#3B2A4A" stroke-width="4"/>
<line x1="892.5" y1="30" x2="892.5" y2="84" stroke="#3B2A4A" stroke-width="5"/>
<text x="892.5" y="24" font-size="22" font-family="serif" fill="#3B2A4A" text-anchor="middle" font-weight="bold">94.6</text>
<path d="M30,74 C2,54 16,34 30,48 C44,34 58,54 30,74Z" fill="#F6C9D3" stroke="#3B2A4A" stroke-width="3"/>
<path d="M970,74 C942,54 956,34 970,48 C984,34 998,54 970,74Z" fill="#E07A9A" stroke="#3B2A4A" stroke-width="3"/>
<text x="64" y="24" font-size="16" font-family="serif" fill="#3B2A4A" text-anchor="start" font-weight="bold" letter-spacing="3">MATCH</text>
</svg>
