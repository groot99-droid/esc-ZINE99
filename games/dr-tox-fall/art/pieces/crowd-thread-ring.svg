<title id="crowd-thread-ring-t">The breath radius: a ring of bare paper</title>
<desc id="crowd-thread-ring-d">The breath radius seen on the floor: an ellipse of bare white paper wiped clean of all hatching, edged with a dashed pen line and short ticks pointing out, centred on him. Stretch it with Pulse; halve it with the shroud closed.</desc>
