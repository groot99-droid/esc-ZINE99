<text x="52" y="32" font-size="13" font-family="monospace" fill="#2a3340" text-anchor="start" letter-spacing="2">HEAD</text>
<rect x="470" y="16" width="86" height="22" fill="none" stroke="#b03030" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.6"/>
<ellipse cx="300" cy="40" rx="74" ry="16" fill="none" stroke="#F2C14E" stroke-width="7.5"/>
<ellipse cx="300" cy="40" rx="60" ry="11" fill="none" stroke="#F2C14E" stroke-width="2.2"/>
<line x1="230" y1="64" x2="216" y2="104" stroke="#F2C14E" stroke-width="3"/>
