<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-labelledby="composite-strip-head-halo-t composite-strip-head-halo-d">
<title id="composite-strip-head-halo-t">Strip, head: a halo (awed)</title>
<desc id="composite-strip-head-halo-d">The awed head strip, a little askew on its sheet: a gold ring drawn over the head with lines falling from it, described only by witnesses who could not see but believed. A grease question mark.</desc>
