<line x1="300" y1="64" x2="300" y2="104" stroke="#F2C14E" stroke-width="3"/>
<line x1="317.5" y1="64" x2="321" y2="104" stroke="#F2C14E" stroke-width="3"/>
<line x1="335" y1="64" x2="342" y2="104" stroke="#F2C14E" stroke-width="3"/>
<line x1="352.5" y1="64" x2="363" y2="104" stroke="#F2C14E" stroke-width="3"/>
<line x1="370" y1="64" x2="384" y2="104" stroke="#F2C14E" stroke-width="3"/>
