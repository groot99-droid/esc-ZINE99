<title id="composite-base-t">The base form, with the constants printed</title>
<desc id="composite-base-d">The pale base form on its own acetate: a too-thin standing shape, skin drawn stretched taut over hollows where mass was pulled inward, thick black veins branching at the neck and arms, the jaw longer than the skull allows, and two small green eyes, the only colour; typed tabs name each constant.</desc>
