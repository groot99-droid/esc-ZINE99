<title id="composite-strip-head-horns-t">Strip, head: horns (terrified)</title>
<desc id="composite-strip-head-horns-d">The terrified head strip, askew: two curved horns drawn heavy over the head, seen by someone who ran; it must be left out the same way as the awed. A grease question mark.</desc>
