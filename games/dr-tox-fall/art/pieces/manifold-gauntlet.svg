<title id="manifold-gauntlet-t">The gauntlet: spine, line and numbered callouts</title>
<desc id="manifold-gauntlet-d">The gauntlet laid out like a product shot: a matte black forearm piece, the clear line in from the wrist shunt at the left carrying a dark red core, the manifold pipe along the spine with six empty valve sockets, and above each a gold callout circle numbered 1 to 6 with a leader line; a stub at the right end for the fifth outlet.</desc>
