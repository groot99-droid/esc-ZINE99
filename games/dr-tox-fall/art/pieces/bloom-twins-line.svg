<title id="bloom-twins-line-t">The Twins' line (a row of blocked edges)</title>
<desc id="bloom-twins-line-d">The line the Twins collapse once: a long jagged black-keyed fault printed across five cell edges in magenta and black dots, cracked down its length; its cost is shown beside it, not here.</desc>
