<title id="crowd-thread-shutter-t">The relief hall's shutter, down</title>
<desc id="crowd-thread-shutter-d">The steel roller shutter at the end of the queue, pulled down at noon: horizontal slats in pen, a chain at one side, hatched shadow under the lip; where the run ends.</desc>
