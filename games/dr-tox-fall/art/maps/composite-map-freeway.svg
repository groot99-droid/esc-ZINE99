<title id="composite-map-freeway-t">Inset map: under the freeway</title>
<desc id="composite-map-freeway-d">A typed plan of the settlement under the freeway: the span as a band, shelters as boxes, the drums, the generator, the laundry lines, the State truck at the front, an X where he stood, and the six witnesses' places circled in red grease pencil.</desc>
