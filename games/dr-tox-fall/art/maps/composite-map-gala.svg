<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-labelledby="composite-map-gala-t composite-map-gala-d">
<title id="composite-map-gala-t">Inset map: the gala floor and the balcony</title>
<desc id="composite-map-gala-d">A typed plan of the gala: round tables, the columns, the balcony along the top, the service door at the left and a security post, an X where it happened and the four witnesses' places circled in red.</desc>
