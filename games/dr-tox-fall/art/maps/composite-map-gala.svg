<circle cx="130" cy="200" r="18" fill="none" stroke="#2a3340" stroke-width="2"/>
<circle cx="230" cy="200" r="18" fill="none" stroke="#2a3340" stroke-width="2"/>
<rect x="52" y="40" width="16" height="16" fill="#2a3340" opacity="0.4"/>
<rect x="292" y="40" width="16" height="16" fill="#2a3340" opacity="0.4"/>
<rect x="2" y="90" width="14" height="50" fill="#2a3340" opacity="0.4"/>
<text x="20" y="84" font-size="10" font-family="monospace" fill="#2a3340" text-anchor="start">SERVICE</text>
