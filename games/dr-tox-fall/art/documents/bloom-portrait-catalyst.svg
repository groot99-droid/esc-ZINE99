<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" role="img" aria-labelledby="bloom-portrait-catalyst-t bloom-portrait-catalyst-d">
<title id="bloom-portrait-catalyst-t">Newsprint portrait: Rostova, captioned CATALYST</title>
<desc id="bloom-portrait-catalyst-d">A portrait as the paper runs it: a woman's head and shoulders in silhouette only, printed in rust and ochre dots in a keylined box, and under it the State's caption in capitals, CATALYST. Her name is Rostova; the bare word is only ever State text beside a portrait.</desc>
