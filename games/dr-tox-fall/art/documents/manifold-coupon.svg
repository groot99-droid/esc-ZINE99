<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="360" height="200" role="img" aria-labelledby="manifold-coupon-t manifold-coupon-d">
<title id="manifold-coupon-t">The coupon corner: PULSE PER DART</title>
<desc id="manifold-coupon-d">The clip-out coupon in the corner: a dashed border with a scissors mark, PULSE PER DART in bold, a blank box for the number this routing costs, and fill-in lines below it like an order form.</desc>
<rect x="8" y="8" width="344" height="184" fill="#fffaf0" stroke="#141414" stroke-width="3" stroke-dasharray="10 7"/>
<path d="M2,30 l14,-6 l-4,12 M2,18 l14,6" fill="none" stroke="#141414" stroke-width="2"/>
<text x="28" y="46" font-size="26" font-family="sans-serif" fill="#141414" text-anchor="start" font-weight="bold" textLength="300" lengthAdjust="spacingAndGlyphs">PULSE PER DART</text>
<rect x="28" y="62" width="140" height="80" fill="#ffffff" stroke="#141414" stroke-width="2.5"/>
<text x="184" y="80" font-size="11" font-family="serif" fill="#141414" text-anchor="start">NAME</text>
<line x1="184" y1="88" x2="330" y2="88" stroke="#141414" stroke-width="1.2"/>
<text x="184" y="108" font-size="11" font-family="serif" fill="#141414" text-anchor="start">ADDRESS</text>
<line x1="184" y1="116" x2="330" y2="116" stroke="#141414" stroke-width="1.2"/>
<line x1="184" y1="144" x2="330" y2="144" stroke="#141414" stroke-width="1.2"/>
<text x="28" y="178" font-size="15" font-family="serif" fill="#141414" text-anchor="start" font-style="italic">Exact routing: +6.  Mail no money.</text>
</svg>
