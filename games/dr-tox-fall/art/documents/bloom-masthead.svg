<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 160" width="1280" height="160" role="img" aria-labelledby="bloom-masthead-t bloom-masthead-d">
<title id="bloom-masthead-t">Masthead: THE MORNING BULLETIN</title>
<desc id="bloom-masthead-d">A newspaper masthead across the top of the page: THE MORNING BULLETIN in heavy serif capitals over a rule, AN RCC PUBLICATION in small type, a blank dateline, and the price in a box.</desc>
<defs><pattern id="bloom-masthead-ben1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(75)"><circle cx="3" cy="3" r="1.6" fill="#d8336a"/></pattern><pattern id="bloom-masthead-ben2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="3" cy="3" r="1.6" fill="#2fa8d8"/></pattern></defs>
<rect x="0" y="0" width="1280" height="160" fill="#efe2b8"/>
<text x="640" y="92" font-size="76" font-family="serif" fill="#141414" text-anchor="middle" font-weight="bold" letter-spacing="4" textLength="1080" lengthAdjust="spacingAndGlyphs">THE MORNING BULLETIN</text>
<rect x="40" y="110" width="1200" height="6" fill="#141414"/>
<rect x="40" y="120" width="1200" height="2" fill="#141414"/>
<text x="44" y="146" font-size="16" font-family="serif" fill="#141414" text-anchor="start" letter-spacing="3">AN RCC PUBLICATION</text>
<line x1="520" y1="146" x2="760" y2="146" stroke="#141414" stroke-width="1"/>
<rect x="1160" y="128" width="80" height="26" fill="none" stroke="#141414" stroke-width="2"/>
<text x="1200" y="147" font-size="14" font-family="serif" fill="#141414" text-anchor="middle">2 CR</text>
<rect x="40" y="20" width="120" height="76" fill="url(#bloom-masthead-ben1)" stroke="#141414" stroke-width="2"/>
<rect x="1120" y="20" width="120" height="76" fill="url(#bloom-masthead-ben2)" stroke="#141414" stroke-width="2"/>
</svg>
