<desc id="persona-page-d">The page: cream newsprint-free paper in a 1950s romance-comic layout, plum gutters, a tall space at the top for the heart panel, a strip at the foot for the hand and the match meter, and a lettered title box: SEVENTY-TWO HOURS TO LOVE HIM!</desc>
