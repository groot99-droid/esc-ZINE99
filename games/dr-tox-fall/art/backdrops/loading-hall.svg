<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="loading-hall-t loading-hall-d">
<title id="loading-hall-t">Loading backdrop: the relief hall at noon, 2229</title>
<desc id="loading-hall-d">The relief hall locked off under flat fluorescent tubes: a long queue of gray-teal shapes still facing a shutter pulled down on a hand-lettered RELIEF SUSPENDED, empty dispensers stamped RCC on the wall, a number board stopped, and at the far right, through a back door, one amber lamp: the night clinic, the only warm thing. A narrow figure in a desaturated green shroud stands apart.</desc>
