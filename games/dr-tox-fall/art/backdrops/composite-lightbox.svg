<title id="composite-lightbox-t">Composite: the light box (backdrop)</title>
<desc id="composite-lightbox-d">The witness room: a gray table, the light box glowing pale in the middle where the stack lies, slotted racks for strips at the left and right, a rail along the bottom for witness cards and a framed space at the top right for the inset map.</desc>
