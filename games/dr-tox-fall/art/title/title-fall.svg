<title id="title-fall-t">Title lettering: Dr. Tox: Fall</title>
<desc id="title-fall-d">The title, DR. TOX in tall pale capitals over FALL in amber, on graded concrete with film grain; an amber monitor line under it steps down a level halfway across, as if the floor had dropped, and a small line names the series and the episode.</desc>
