<title id="seat-laughs-red-t">The one who laughs (red)</title>
<desc id="seat-laughs-red-d">Seat portrait of the one who laughs, fully red, in the gold light of the heart: a linocut head and shoulders, head thrown back, mouth open, one big hand flung up, his seat stripe on the shoulder.</desc>
