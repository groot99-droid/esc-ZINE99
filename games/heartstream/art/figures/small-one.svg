<title id="small-one-t">The small one moves a counter</title>
<desc id="small-one-d">A small Blue-Born child at the edge of the board, as a linocut: only his head over the rim, two round eyes looking up to see whether it was allowed, and one small blue hand setting a single counter into a hollow that is not his.</desc>
