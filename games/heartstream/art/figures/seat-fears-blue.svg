<title id="seat-fears-blue-t">The one who fears (blue)</title>
<desc id="seat-fears-blue-d">Seat portrait of the one who fears, still blue, in the marrow lights: a linocut head and shoulders, shoulders high, eyes wide, a finger at his lips, his seat stripe on the shoulder.</desc>
