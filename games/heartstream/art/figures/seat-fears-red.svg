<title id="seat-fears-red-t">The one who fears (red)</title>
<desc id="seat-fears-red-d">Seat portrait of the one who fears, fully red, in the gold light of the heart: a linocut head and shoulders, shoulders high, eyes wide, a finger at his lips, his seat stripe on the shoulder.</desc>
