<title id="ending-the-one-who-stayed-t">Ending: The One Who Stayed</title>
<desc id="ending-the-one-who-stayed-d">The ending card for The One Who Stayed: an old blue hand at a dimmed lamp, four small figures coming out of the bone, and a raft with a mark waiting at the top of the shaft, cut as a block print, beside the ending's name.</desc>
