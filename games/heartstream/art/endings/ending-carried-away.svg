<text x="1200" y="481" font-size="38" font-family="serif" fill="#f0e6cf" text-anchor="middle" font-style="italic">No one stays together.</text>
<text x="1200" y="537" font-size="38" font-family="serif" fill="#f0e6cf" text-anchor="middle" font-style="italic">Everyone is carried away.</text>
<text x="1200" y="593" font-size="38" font-family="serif" fill="#f0e6cf" text-anchor="middle" font-style="italic">Life is a river that never lets you</text>
<text x="1200" y="649" font-size="38" font-family="serif" fill="#f0e6cf" text-anchor="middle" font-style="italic">hold what you love for long.</text>
