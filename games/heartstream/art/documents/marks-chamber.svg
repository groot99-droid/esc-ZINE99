<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-labelledby="marks-chamber-t marks-chamber-d">
<title id="marks-chamber-t">The fourth mark: the mouth of the shared chamber</title>
<desc id="marks-chamber-d">The shared chamber as the back of the chart draws it, in red ink on vellum: one vessel in, two out. At the mouth two signs are cut side by side, low, at the first height, home; at the outlets the same two signs again, apart. Two who held together, and the valve.</desc>
