<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-labelledby="keeper-underside-t keeper-underside-d">
<title id="keeper-underside-t">The Lamp-Keeper's tool, turned over</title>
<desc id="keeper-underside-d">The inside face of the Lamp-Keeper's worn tool, the one his brother made for him: four signs cut small in a row (the wave, the spiral, the fork, the star) and over each a bead on a strand, the beads left uncut except the last, which sits on the lowest line: home. The key to the Four Marks: they are a phrase.</desc>
