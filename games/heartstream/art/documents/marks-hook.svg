<title id="marks-hook-t">The third mark: the hook in the Warden's hold</title>
<desc id="marks-hook-d">The old carved hook, grey and smooth, healed half into the milky skin of the Warden's hold among other kept gifts. Its grip is ringed with five cut bands; the fork is cut beside the second: the one the Warden took.</desc>
