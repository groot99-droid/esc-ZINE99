<title id="marks-board-t">The first mark: the rim of the oldest board</title>
<desc id="marks-board-d">The rim of the oldest board in the hall, seen end-on: the near keep and two hollows, and along the rim the tally the group kept, stopped at three. The wave is cut beside the third notch: the brother sent up the shaft with nothing, whose game is still one move from finished.</desc>
