<title id="marks-wall-t">The second mark: the gap on the Stencil Wall</title>
<desc id="marks-wall-d">A row of three hand stencils on the Stencil Wall, ochre and charcoal, and a gap where a fourth should be. In the gap, scratched with a tool rather than blown, the spiral, at the fourth height: the Lamp-Keeper's own place, kept empty.</desc>
