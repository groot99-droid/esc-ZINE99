<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="1600" height="1100" role="img" aria-labelledby="chart-back-t chart-back-d">
<title id="chart-back-t">The Back of the Chart</title>
<desc id="chart-back-d">The back of the chart, held to the light: the plate shows through reversed and faint, and the awl's pricks shine. They draw the heart, and every vessel leaving it apart from every other, each ending alone in a small cold ring.</desc>
