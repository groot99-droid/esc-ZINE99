<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="counters-board-t counters-board-d">
<title id="counters-board-t">The Bone Counters board</title>
<desc id="counters-board-d">The sowing board cut as a linocut: a black block with two rows of five cream hollows and a long keep at each end, gouge marks left in every pit, a tally of rounds won cut in the rim, and the anticlockwise way of sowing shown as a row of small cuts.</desc>
