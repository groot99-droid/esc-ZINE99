<title id="ui-emote-wheel-t">The emote wheel</title>
<desc id="ui-emote-wheel-d">The emote wheel: a ring of bone cut into four quarters, laugh, argue, dream and fear, each glyph rubbed with its seat colour, around a small heart at the hub.</desc>
