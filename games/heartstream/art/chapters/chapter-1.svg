<title id="chapter-1-t">Chapter 1: The Marrow Lights</title>
<desc id="chapter-1-d">Chapter card I, The Marrow Lights, as a block print: the marrow tunnel, its walls pulsing, four sleepers in their alcoves and the steady lamps down the hall.</desc>
