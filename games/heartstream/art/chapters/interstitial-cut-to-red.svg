<title id="interstitial-cut-to-red-t">Interstitial: the cut to red</title>
<desc id="interstitial-cut-to-red-d">The cut to red: one long gouge splits the block from corner to corner, blue on one side and red on the other, and two hands that were holding are left either side of it, fingers just apart.</desc>
