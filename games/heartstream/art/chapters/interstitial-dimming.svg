<title id="interstitial-dimming-t">Interstitial: the dimming</title>
<desc id="interstitial-dimming-d">The dimming: a row of marrow lamps across the dark, each lower than the one before it, the last a cold cup; the cuts of light around them thin out with the flames.</desc>
