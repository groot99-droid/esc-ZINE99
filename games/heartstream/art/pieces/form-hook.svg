<title id="form-hook-t">Carving form: the hook</title>
<desc id="form-hook-d">The hook as a finished gift, engraved on ivory: the tool lies bare on a hatched slab, its grain showing, and a small vignette shows its use (one more hold of reach on the climb).</desc>
