<title id="underside-counter-t">Underside sign: a counter in its hollow</title>
<desc id="underside-counter-d">An underside sign, a counter in its hollow: cut small and fine on the hollowed inside face of a gift and rubbed marrow blue, where the one who receives it will not look until his last scene.</desc>
