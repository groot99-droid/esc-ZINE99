<title id="form-awl-t">Carving form: the awl</title>
<desc id="form-awl-d">The awl as a finished gift, engraved on ivory: the tool lies bare on a hatched slab, its grain showing, and a small vignette shows its use (pricks the chart where a patrol waits).</desc>
