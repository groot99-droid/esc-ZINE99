<title id="bead-argues-t">Song bead: the one who argues</title>
<desc id="bead-argues-d">A song bead in the timbre of the one who argues (hard-edged, with the accent cut above it), threaded on its strand against the marrow dark; its height on the five faint lines is its pitch.</desc>
