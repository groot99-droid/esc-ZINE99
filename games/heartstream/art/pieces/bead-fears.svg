<title id="bead-fears-t">Song bead: the one who fears</title>
<desc id="bead-fears-d">A song bead in the timbre of the one who fears (small and close, a tight held note), threaded on its strand against the marrow dark; its height on the five faint lines is its pitch.</desc>
