<title id="underside-raft-t">Underside sign: the raft on the line</title>
<desc id="underside-raft-d">An underside sign, the raft on the line: cut small and fine on the hollowed inside face of a gift and rubbed marrow blue, where the one who receives it will not look until his last scene.</desc>
