<title id="underside-open-hand-t">Underside sign: an open hand</title>
<desc id="underside-open-hand-d">An underside sign, an open hand: cut small and fine on the hollowed inside face of a gift and rubbed marrow blue, where the one who receives it will not look until his last scene.</desc>
