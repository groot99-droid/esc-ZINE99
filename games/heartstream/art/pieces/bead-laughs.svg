<title id="bead-laughs-t">Song bead: the one who laughs</title>
<desc id="bead-laughs-d">A song bead in the timbre of the one who laughs (bright, ringing: ripples spread from it), threaded on its strand against the marrow dark; its height on the five faint lines is its pitch.</desc>
