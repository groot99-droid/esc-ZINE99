<title id="underside-two-hands-t">Underside sign: two hands meeting</title>
<desc id="underside-two-hands-d">An underside sign, two hands meeting: cut small and fine on the hollowed inside face of a gift and rubbed marrow blue, where the one who receives it will not look until his last scene.</desc>
