<title id="bead-dreams-t">Song bead: the one who dreams</title>
<desc id="bead-dreams-d">A song bead in the timbre of the one who dreams (soft and far, haloed), threaded on its strand against the marrow dark; its height on the five faint lines is its pitch.</desc>
