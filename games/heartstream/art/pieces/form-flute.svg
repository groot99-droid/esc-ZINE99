<title id="form-flute-t">Carving form: the flute</title>
<desc id="form-flute-d">The flute as a finished gift, engraved on ivory: the tool lies bare on a hatched slab, its grain showing, and a small vignette shows its use (after each calm, the beat is easier to find).</desc>
