<title id="form-comb-t">Carving form: the comb</title>
<desc id="form-comb-d">The comb as a finished gift, engraved on ivory: the tool lies bare on a hatched slab, its grain showing, and a small vignette shows its use (tendrils pass through its teeth).</desc>
