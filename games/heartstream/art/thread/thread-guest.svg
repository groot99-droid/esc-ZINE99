<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="thread-guest-t thread-guest-d">
<title id="thread-guest-t">Thread (guest): the ring a cup leaves</title>
<desc id="thread-guest-d">The ring a cup leaves on a table, as it sits unremarked on the carving slab: no ground and no frame of its own, only scrimshaw marks laid straight on the slab's ivory. A damp ring not quite closed, the lamp cup that stood there moved aside, a hook and a few shavings.</desc>
