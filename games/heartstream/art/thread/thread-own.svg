<title id="thread-own-t">Thread: the unfinished board and the closed hand</title>
<desc id="thread-own-d">A game board left unfinished, with one counter still closed in somebody's hand: a linocut of the board's near end, counters lying in three of its hollows, and above it a fist that has not yet let its last counter fall.</desc>
