<title id="figure-oda-t">Oda on the wet ink stroke</title>
<desc id="figure-oda-d">Oda side-on, masked like every pilgrim, sliding along the Scribe's wet ink stroke with the inkpot held level in both hands and a lantern on a staff across her back; sepia on grey paper, one orange light.</desc>
