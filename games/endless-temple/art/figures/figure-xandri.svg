<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="figure-xandri-t figure-xandri-d">
<title id="figure-xandri-t">Xandri on leaf shoes</title>
<desc id="figure-xandri-d">Xandri side-on, riding a sand wave on two woody leaves tied to his feet: knees bent, arms out, his ochre head-cloth and his father's leaf-cord flying back, the patched pack with its holes on his back.</desc>
