<title id="figure-elaris-t">Elaris side-on</title>
<desc id="figure-elaris-d">Elaris Sel Marden side-on, walking the stacks: almost eight feet tall and thin, in monk's attire, sea-froth skin and a long ear, the cup in one hand and a closed book under the other arm, sand trailing from its pages.</desc>
