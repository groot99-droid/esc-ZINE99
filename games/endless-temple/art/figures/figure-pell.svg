<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="figure-pell-t figure-pell-d">
<title id="figure-pell-t">Pell under the Clerk's umbrella</title>
<desc id="figure-pell-d">Pell side-on, lifted off a Hollin roof ridge by the dead Clerk's umbrella: both hands on the crook, boots trailing, scarf out behind, the gusts drawn as hatching in graphite and slate blue.</desc>
