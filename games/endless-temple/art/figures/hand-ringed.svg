<title id="hand-ringed-t">The other hand: older, with a brass ring</title>
<desc id="hand-ringed-d">The same reach and the same cup in an older, greyer hand with a brass ring on the second finger and a dark sleeve: the hand in The Other Hand, which brings a cup the player did not ask for. No face is shown.</desc>
