<title id="ledger-back-3-forty-t">Ledger, back: forty, against the journal</title>
<desc id="ledger-back-3-forty-d">The back of the ledger with a slip of the father's journal laid across it: both counts stop at forty, and a deep tea ring marks where the cup stood.</desc>
