<title id="ledger-back-2-thirty-one-t">Ledger, back: day thirty-one</title>
<desc id="ledger-back-2-thirty-one-d">The back of the ledger: the count runs on past thirty, the entry for day thirty-one, and the tallies stop at a heavy fortieth stroke over three tea rings.</desc>
