<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" role="img" aria-labelledby="ledger-back-4-elaris-t ledger-back-4-elaris-d">
<title id="ledger-back-4-elaris-t">Ledger, back: the page in Elaris's hand</title>
<desc id="ledger-back-4-elaris-d">A last leaf at the back of the ledger in a second, upright hand in sage-dark ink: the unfinished recipe finished (sprig, gutter sand, gutter sand, mark 3) with the herbs sketched, a warning that the front pages bind, and one woody leaf pressed at the foot.</desc>
