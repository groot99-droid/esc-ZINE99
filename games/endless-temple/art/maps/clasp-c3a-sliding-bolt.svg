<title id="clasp-c3a-sliding-bolt-t">Clasp: Sliding bolt</title>
<desc id="clasp-c3a-sliding-bolt-d">A cutaway of the first clasp: six brass, steel and copper tabs in a four by five housing, the two-wide bolt tab with its arrow, and the release slot waiting on the right.</desc>
