<title id="clasp-c3b-lever-bank-t">Clasp: Lever bank</title>
<desc id="clasp-c3b-lever-bank-d">A cutaway of the lever bank: five brass levers on one rail, three raised and two flat, joined to their neighbours by link rods so that pressing one flips three.</desc>
