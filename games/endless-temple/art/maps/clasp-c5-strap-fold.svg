<title id="clasp-c5-strap-fold-t">Clasp: Strap fold</title>
<desc id="clasp-c5-strap-fold-d">Six stitched leather straps crossing a slate cover in three layers over a brass hasp; only a strap with nothing across it will lift, and the top one is ready.</desc>
