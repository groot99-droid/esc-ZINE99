<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="1000" height="750" role="img" aria-labelledby="clasp-closing-clasp-t clasp-closing-clasp-d">
<title id="clasp-closing-clasp-t">Clasp: The closing clasp</title>
<desc id="clasp-closing-clasp-d">The sand book's own clasp, seen open across its fore-edge: a hinged hasp standing clear of its pin, an arrow that swings it shut, sand still leaving the pages, and the cup set down beside it on the cover.</desc>
