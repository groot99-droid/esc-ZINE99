<title id="cartouche-c1-t">Cartouche: yesterday's book</title>
<desc id="cartouche-c1-d">The cartouche for yesterday's book on green leather: an oval with THE and OF set in gold and three blind slots, apple-leaf stamps at its ends, the gutter still.</desc>
