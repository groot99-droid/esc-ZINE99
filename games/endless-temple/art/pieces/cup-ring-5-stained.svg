<title id="cup-ring-5-stained-t">Cup ring, state 5 (steep 80 and over)</title>
<desc id="cup-ring-5-stained-d">The cup on the walnut table from above, at steep 80 and over: a ring stained deep into the wood, four older ones round it, no sunbeam, and three spoons already in the cup.</desc>
