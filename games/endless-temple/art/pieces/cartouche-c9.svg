<title id="cartouche-c9-t">Cartouche: the sand book, with the scraped title</title>
<desc id="cartouche-c9-d">The sand book's cartouche under raking light: four blind slots between THE and AND THE, and under them the ghost of a scraped title in another hand, The Desert That Ends; sand runs in the gutter.</desc>
