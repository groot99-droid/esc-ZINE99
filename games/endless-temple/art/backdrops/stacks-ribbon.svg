<title id="stacks-ribbon-t">Stacks tile: Maudric's ribbon</title>
<desc id="stacks-ribbon-d">The stacks, drawn in one fine line. An old sage bookmark ribbon hung at a junction of three ways, marking the quicker way past the books he read.</desc>
