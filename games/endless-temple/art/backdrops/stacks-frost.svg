<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="stacks-frost-t stacks-frost-d">
<title id="stacks-frost-t">Stacks tile: Frost on the shelf edges</title>
<desc id="stacks-frost-d">The stacks, drawn in one fine line. The unlit shelf: no motes, a candle's two-metre radius, and frost thickening on the shelf edges where nothing calls.</desc>
