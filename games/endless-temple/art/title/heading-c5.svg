<title id="heading-c5-t">Chapter heading V: The Weather-Clerk of Hollin</title>
<desc id="heading-c5-d">Chapter V, The Weather-Clerk of Hollin, tooled in gold on a strip of leather: the numeral in a dotted roundel under an umbrella in rain, the name between ruled lines, and silver sand gathering along the lower fillet as the book leaks.</desc>
