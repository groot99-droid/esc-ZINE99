<title id="heading-c4-t">Chapter heading IV: The Silver Dunes</title>
<desc id="heading-c4-d">Chapter IV, The Silver Dunes, tooled in gold on a strip of leather: the numeral in a dotted roundel under a breaking wave of sand, the name between ruled lines, and silver sand gathering along the lower fillet as the book leaks.</desc>
