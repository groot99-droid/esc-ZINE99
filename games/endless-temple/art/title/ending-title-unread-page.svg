<title id="ending-title-unread-page-t">Ending lettering: The Unread Page</title>
<desc id="ending-title-unread-page-d">The Unread Page, tooled in gold on worn ochre-brown leather between woody leaves; under it a small blank panel where a title would go, left empty.</desc>
