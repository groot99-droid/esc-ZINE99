<title id="heading-c2-t">Chapter heading II: The Storyteller's Circle</title>
<desc id="heading-c2-d">Chapter II, The Storyteller's Circle, tooled in gold on a strip of leather: the numeral in a dotted roundel under a fire and a rising voice, the name between ruled lines, and silver sand gathering along the lower fillet as the book leaks.</desc>
