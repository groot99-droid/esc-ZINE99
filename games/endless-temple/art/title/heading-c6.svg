<title id="heading-c6-t">Chapter heading VI: The Father's Mark</title>
<desc id="heading-c6-d">Chapter VI, The Father's Mark, tooled in gold on a strip of leather: the numeral in a dotted roundel under a pole in a ring of stones, the name between ruled lines, and silver sand gathering along the lower fillet as the book leaks.</desc>
