<title id="heading-c7-t">Chapter heading VII: The Long Procession</title>
<desc id="heading-c7-d">Chapter VII, The Long Procession, tooled in gold on a strip of leather: the numeral in a dotted roundel under three lanterns on a line, the name between ruled lines, and silver sand gathering along the lower fillet as the book leaks.</desc>
