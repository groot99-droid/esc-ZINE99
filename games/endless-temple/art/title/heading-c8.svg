<title id="heading-c8-t">Chapter heading VIII: The Unlit Shelf</title>
<desc id="heading-c8-d">Chapter VIII, The Unlit Shelf, tooled in gold on a strip of leather: the numeral in a dotted roundel under one candle, the name between ruled lines, and silver sand gathering along the lower fillet as the book leaks.</desc>
