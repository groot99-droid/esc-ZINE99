<title id="heading-c9-t">Chapter heading IX: The End of the Sand</title>
<desc id="heading-c9-d">Chapter IX, The End of the Sand, tooled in gold on a strip of leather: the numeral in a dotted roundel under three backs on a horizon, the name between ruled lines, and silver sand gathering along the lower fillet as the book leaks.</desc>
