<title id="heading-c3-t">Chapter heading III: The Keeper's Rounds</title>
<desc id="heading-c3-d">Chapter III, The Keeper's Rounds, tooled in gold on a strip of leather: the numeral in a dotted roundel under a broom and swept sand, the name between ruled lines, and silver sand gathering along the lower fillet as the book leaks.</desc>
