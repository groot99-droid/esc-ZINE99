<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384" role="img" aria-labelledby="runner-sheet-mossa-t runner-sheet-mossa-d">
<title id="runner-sheet-mossa-t">Crack runner sprites: Mossa</title>
<desc id="runner-sheet-mossa-d">Mossa's sprite sheet, sixteen frames in two rows: four run frames, jump, cling, roll and brace; then the sap slide, the stun, listening at a wall, carrying Pell's lantern, dropping it to the crowd, catching it again, idle, and counting her steps. Her red scarf trails in every one.</desc>
