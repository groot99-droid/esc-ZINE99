<title id="runner-sheet-crowd-t">Crack runner sprites: the crowd</title>
<desc id="runner-sheet-crowd-d">The crowd of Lowridge, sixteen figures in two rows: walkers with their doors on their backs, an elder on a cane, a child, a hooded priest, a tapper with her mallet, two who lift and pass a lantern overhead, one who has sat down, and Sorrel pointing the way up.</desc>
