<title id="thread-guest-t">Thread (guest): a slip that says You're at the far end</title>
<desc id="thread-guest-d">The object this game hides for the collection: a runner's slip of bark-paper pinned to the wall of a crack with a splinter, lit by one lantern. In a quick hand it says: You're at the far end.</desc>
