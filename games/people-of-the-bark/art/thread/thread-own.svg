<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-labelledby="thread-own-t thread-own-d">
<title id="thread-own-t">Thread: a knock answered from the other side of a wall</title>
<desc id="thread-own-d">The game's own thread object: a wall of bark seen in section. On the warm side a small figure has just knocked and leans in to listen, a lantern at her feet; on the cold side, in thin paper galleries ribbed with mud, the same three marks come back in chalk grey. Nothing on that side is shown but its walls.</desc>
