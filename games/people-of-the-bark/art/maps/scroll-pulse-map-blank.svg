<title id="scroll-pulse-map-blank-t">Tremor Scroll: the Pulse map strip, not yet filled</title>
<desc id="scroll-pulse-map-blank-d">The Pulse map as Fenn first rules it on the back pages of Old Resin's recipe book: the same grid of the bark's plates from the Crown down to the roots and the three listening posts named beside it, with no plate shaded yet and nothing ringed. The web game shades a plate for each faceless mark the player places.</desc>
