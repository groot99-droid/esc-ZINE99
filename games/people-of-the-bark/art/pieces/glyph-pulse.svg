<title id="glyph-pulse-t">Chronicle glyph: The Pulse</title>
<desc id="glyph-pulse-d">A new chronicle glyph, printed letterpress in brown over an off-register tint. A ring with small ticks inside it and nothing else: a rhythm that comes from no face of the Trunk.</desc>
