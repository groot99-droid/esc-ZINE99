<title id="glyph-floor-went-first-t">Chronicle glyph: The floor went first</title>
<desc id="glyph-floor-went-first-d">A new chronicle glyph, printed letterpress in brown over an off-register tint. Underhollow as Sorrel's grandmother told it: dwellings standing on a broken line, the floor under them gone to dots.</desc>
