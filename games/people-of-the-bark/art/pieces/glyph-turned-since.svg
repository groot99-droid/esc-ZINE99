<title id="glyph-turned-since-t">Chronicle glyph: Turned since</title>
<desc id="glyph-turned-since-d">A new chronicle glyph, printed letterpress in brown over an off-register tint. A ring with a turning arrow and its notch off the line: someone has turned the door since the Knot left it.</desc>
