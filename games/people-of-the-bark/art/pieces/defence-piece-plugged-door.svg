<title id="defence-piece-plugged-door-t">Crack defence piece: the plugged door</title>
<desc id="defence-piece-plugged-door-d">The plugged door: a round hole in the paper wall stopped by one flat, pitted, amber-brown disc that never comes out. A ring of gold marks the reach inside which a warrior may not be left for ten seconds.</desc>
