<title id="defence-piece-mud-wall-t">Crack defence piece: mud wall</title>
<desc id="defence-piece-mud-wall-d">A mud wall: a breach in a bark block closed from the other side with pale ribbed mud, still damp at the edges. Whatever built it is not shown; only its work.</desc>
