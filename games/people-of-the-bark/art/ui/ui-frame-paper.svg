<title id="ui-frame-paper-t">Bark-paper page frame</title>
<desc id="ui-frame-paper-d">A bark-paper page frame for the 1D pages: a double rule in red and brown ink, gold bezants along the head, vines climbing both margins, a sap stain, and a snail crossing the foot.</desc>
