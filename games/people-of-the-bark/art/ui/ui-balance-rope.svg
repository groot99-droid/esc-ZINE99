<title id="ui-balance-rope-t">The Balance Rope</title>
<desc id="ui-balance-rope-d">The Balance Rope: three twisted strands, gold for the Eye, red for the Spear and blue for the Quill, hung from a carved peg with the three sigils above, and the knot that marks a twelve-point lead.</desc>
