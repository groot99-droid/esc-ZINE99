<title id="ui-bark-song-t">Bark-song crack</title>
<desc id="ui-bark-song-d">The bark-song: a thin crack along the foot of the screen that widens from left to right as the bark's integrity falls, glowing at the two marks where the bark groans (40) and where a plate gives (25).</desc>
