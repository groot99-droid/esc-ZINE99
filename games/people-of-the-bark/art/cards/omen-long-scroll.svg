<title id="omen-long-scroll-t">Omen card: The Long Scroll</title>
<desc id="omen-long-scroll-d">Omen card The Long Scroll: the Tremor Scroll unrolling the whole height of the card, every shake inked on it, a scholar still writing at its end. Suit Tremor (message), the quill sigil, weight 3, with Pell's notches down the left edge.</desc>
