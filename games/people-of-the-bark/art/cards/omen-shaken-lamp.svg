<title id="omen-shaken-lamp-t">Omen card: The Shaken Lamp</title>
<desc id="omen-shaken-lamp-d">Omen card The Shaken Lamp: a lantern swinging on its hook as dust comes down, a robed hand lifted to steady it. Suit Tremor (message), the eye sigil, weight 1, with Pell's notches down the left edge.</desc>
