<title id="omen-singer-above-t">Omen card: The Singer Above</title>
<desc id="omen-singer-above-d">Omen card The Singer Above: the breast and beak of a singer leaning in from the sky, five notes falling toward three raised hoods. Suit Song (prophecy), the eye sigil, weight 3, with Pell's notches down the left edge.</desc>
