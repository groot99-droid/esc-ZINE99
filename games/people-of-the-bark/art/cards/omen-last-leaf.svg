<title id="omen-last-leaf-t">Omen card: The Last Leaf</title>
<desc id="omen-last-leaf-d">Omen card The Last Leaf: one copper leaf left on a bare twig and an old reader beneath it, one hand lifted as if he knows which is his. Suit Leaf (death), the eye sigil, weight 3, with Pell's notches down the left edge.</desc>
