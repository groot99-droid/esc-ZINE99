<title id="omen-full-cup-t">Omen card: The Full Cup</title>
<desc id="omen-full-cup-d">Omen card The Full Cup: a great rain bead falling into a gold cup that brims over, two robed figures lifting their hands to it. Suit Rain (blessing), the eye sigil, weight 3, with Pell's notches down the left edge.</desc>
