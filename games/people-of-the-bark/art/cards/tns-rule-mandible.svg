<title id="tns-rule-mandible-t">Rule card: Mandible</title>
<desc id="tns-rule-mandible-d">Rule card Mandible (from Mandible): A beetle on the board: a god blocks, a monster hides any Folk it touches. A small knotwork board above the words shows the rule happening.</desc>
