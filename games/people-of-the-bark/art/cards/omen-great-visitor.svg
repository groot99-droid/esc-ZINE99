<title id="omen-great-visitor-t">Omen card: The Great Visitor</title>
<desc id="omen-great-visitor-d">Omen card The Great Visitor: a beetle under a gold halo, two small robed figures bowed before it with an offering bowl. Suit Mandible (monster or god), the eye sigil, weight 1, with Pell's notches down the left edge.</desc>
