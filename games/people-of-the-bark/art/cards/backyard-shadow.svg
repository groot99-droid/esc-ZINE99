<title id="backyard-shadow-t">Backyard card: a hand, checking for termites</title>
<desc id="backyard-shadow-d">Backyard card, turned: the real cause, a hand, checking for termites, drawn small and plain in ordinary daylight: a sleeve and a hand reaching in from the edge, knuckles to the bark; no face is shown. It has no fitting suit.</desc>
