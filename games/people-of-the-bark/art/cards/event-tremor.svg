<title id="event-tremor-t">Event card: The Tremor</title>
<desc id="event-tremor-d">Event card The Tremor, as the people saw it. The world shakes at dawn: three cracks of light down the wall, dust coming off every ridge, small figures running. Weight 2, suit Tremor.</desc>
