<title id="backyard-rain-t">Backyard card: a spring shower</title>
<desc id="backyard-rain-d">Backyard card, turned: the real cause, a spring shower, drawn small and plain in ordinary daylight: a small cloud raining on the lawn beside the tree, a puddle forming. In its corner, the suit that fits: Rain.</desc>
