<title id="backyard-leaf-t">Backyard card: autumn</title>
<desc id="backyard-leaf-d">Backyard card, turned: the real cause, autumn, drawn small and plain in ordinary daylight: leaves coming down off two bare branches onto a raked pile, the rake against the fence. In its corner, the suit that fits: Leaf.</desc>
