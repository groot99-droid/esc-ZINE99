<title id="backyard-beetle-t">Backyard card: a ground beetle</title>
<desc id="backyard-beetle-d">Backyard card, turned: the real cause, a ground beetle, drawn small and plain in ordinary daylight: a ground beetle walking through the grass toward the foot of the tree. In its corner, the suit that fits: Mandible.</desc>
