<title id="backyard-tremor-t">Backyard card: a squirrel</title>
<desc id="backyard-tremor-d">Backyard card, turned: the real cause, a squirrel, drawn small and plain in ordinary daylight: a squirrel clinging head-down to the trunk, scratching an itch with a hind foot. In its corner, the suit that fits: Tremor.</desc>
