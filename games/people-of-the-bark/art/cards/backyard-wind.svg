<title id="backyard-wind-t">Backyard card: a summer gust</title>
<desc id="backyard-wind-d">Backyard card, turned: the real cause, a summer gust, drawn small and plain in ordinary daylight: washing blown sideways on the line between two posts. In its corner, the suit that fits: Wind.</desc>
