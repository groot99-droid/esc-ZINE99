<title id="recipe-03-pollen-cake-t">Recipe plate 3: Pollen Cake</title>
<desc id="recipe-03-pollen-cake-d">Recipe plate 3, Pollen Cake, as an alchemical diagram: pollen, honeydew carried into the pot, high heat, a long boil, 3 to 4 stirs, and below it the hard thing that comes out. Old Resin's hint word is “sweet”.</desc>
