<title id="recipe-02-lichen-loaf-t">Recipe plate 2: Lichen Loaf</title>
<desc id="recipe-02-lichen-loaf-d">Recipe plate 2, Lichen Loaf, as an alchemical diagram: lichen carried into the pot, high heat, a long boil, 3 to 4 stirs, and below it the hard thing that comes out. Old Resin's hint word is “firm”.</desc>
