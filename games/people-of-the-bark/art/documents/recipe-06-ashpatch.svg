<title id="recipe-06-ashpatch-t">Recipe plate 6: Ashpatch</title>
<desc id="recipe-06-ashpatch-d">Recipe plate 6, Ashpatch, as an alchemical diagram: resin, ash carried into the pot, high heat, a short boil, 3 to 4 stirs, and below it the glue thing that comes out. Old Resin's hint word is “gritty”.</desc>
