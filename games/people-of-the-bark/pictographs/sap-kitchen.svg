<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="sap-kitchen-t sap-kitchen-d">
<title id="sap-kitchen-t">Sap Kitchen: Alchemical diagram</title>
<desc id="sap-kitchen-d">Sap Kitchen (1D): Old Resin's cooking drawn as an alchemical diagram. Around a great circle sit the eight ingredient symbols; numbered arrows carry sap, then pollen, then honeydew into the pot at the centre, set over a middle fire with three stirs and a long boil. Beneath, the pot resolves into one of three vessels, food, sealant or offering, and the food flask is lit: a Pollen Cake has been found.</desc>
