<title id="lettering-paid-in-kind-t">Ending card lettering: Paid in Kind</title>
<desc id="lettering-paid-in-kind-d">The lettering laid over the Paid in Kind ending card: the name cut in an upright engraved italic on cream laid paper, over wave hatching, with 'outstanding, for ever' set in small capitals and the Voice’s clockwise spiral at the corner.</desc>
