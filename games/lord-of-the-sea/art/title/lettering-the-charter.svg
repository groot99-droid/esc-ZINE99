<title id="lettering-the-charter-t">Ending card lettering: The Charter</title>
<desc id="lettering-the-charter-d">The lettering laid over the The Charter ending card: the name cut in an upright engraved italic on cream laid paper, over a rule that is ruled on the left and waved on the right, with 'terms between a god and the people who sail' set in small capitals and the Voice’s clockwise spiral at the corner.</desc>
