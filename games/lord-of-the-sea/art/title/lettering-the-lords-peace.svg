<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="lettering-the-lords-peace-t lettering-the-lords-peace-d">
<title id="lettering-the-lords-peace-t">Ending card lettering: The Lord's Peace</title>
<desc id="lettering-the-lords-peace-d">The lettering laid over the The Lord's Peace ending card: the name cut in an upright engraved italic on lamp-white Company stock, over ruled hatching, with 'examined and entered' set in small capitals and a green tick where the Voice’s spiral would be.</desc>
