<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="reckon-unwritten-t reckon-unwritten-d">
<title id="reckon-unwritten-t">Dead Reckoning sheet: off the chart's edge</title>
<desc id="reckon-unwritten-d">The first plot, as the sheet lies before the pencil touches it: 46 points to the nautical mile, the engraved coast stopping at the left, the last fix, two rocks, the target ring and the rose. The leg, the tide arrows and the clock are the player's to lay, so the sheet carries none.</desc>
