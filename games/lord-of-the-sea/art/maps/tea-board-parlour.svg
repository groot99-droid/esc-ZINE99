<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="tea-board-parlour-t tea-board-parlour-d">
<title id="tea-board-parlour-t">The Tea Board: the tavern parlour board</title>
<desc id="tea-board-parlour-d">The parlour Tea Board in blue-and-white porcelain: four ports as pagodas (Home, Tidewater, Unwritten, Salt) joined by four willow-pattern lanes of three slots each, inside a beaded border, with a willow, doves and a junk.</desc>
