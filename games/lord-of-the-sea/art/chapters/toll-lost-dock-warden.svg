<title id="toll-lost-dock-warden-t">Toll vignette: The dock-warden</title>
<desc id="toll-lost-dock-warden-d">A toll vignette for the Tide Reckoning, engraved, showing no person: his lantern left burning on the quay edge beside his keys.</desc>
