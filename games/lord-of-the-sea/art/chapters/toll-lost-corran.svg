<title id="toll-lost-corran-t">Toll vignette: Corran</title>
<desc id="toll-lost-corran-d">A toll vignette for the Tide Reckoning, engraved, showing no person: a rowing boat under a light that went out, his lantern dark in the bow.</desc>
