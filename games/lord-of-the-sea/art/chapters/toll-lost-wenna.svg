<title id="toll-lost-wenna-t">Toll vignette: Wenna</title>
<desc id="toll-lost-wenna-d">A toll vignette for the Tide Reckoning, engraved, showing no person: the empty ferry stage: her count chalked on the rail, the bell, rings on the water.</desc>
