<title id="toll-wreck-lighter-t">Toll vignette: The pay lighter</title>
<desc id="toll-wreck-lighter-d">A toll vignette for the Tide Reckoning, engraved, showing no person: a lighter loaded with the week's pay settling off the warehouses, chests adrift.</desc>
