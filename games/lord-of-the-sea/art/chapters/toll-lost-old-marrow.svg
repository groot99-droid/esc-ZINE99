<title id="toll-lost-old-marrow-t">Toll vignette: Old Marrow</title>
<desc id="toll-lost-old-marrow-d">A toll vignette for the Tide Reckoning, engraved, showing no person: his skiff adrift beside his grandchildren's nets, nobody in it.</desc>
