<title id="toll-wreck-ferry-t">Toll vignette: The ferry</title>
<desc id="toll-wreck-ferry-d">A toll vignette for the Tide Reckoning, engraved, showing no person: the Tidewater ferry down by the head on its six-minute crossing.</desc>
