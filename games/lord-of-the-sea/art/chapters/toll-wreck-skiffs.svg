<title id="toll-wreck-skiffs-t">Toll vignette: Two reef skiffs</title>
<desc id="toll-wreck-skiffs-d">A toll vignette for the Tide Reckoning, engraved, showing no person: two of the reef skiffs on the Salt Steps reef, one keel up.</desc>
