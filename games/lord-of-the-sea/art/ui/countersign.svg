<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="260" height="160" role="img" aria-labelledby="countersign-t countersign-d">
<title id="countersign-t">The countersign: the Lord of Tea's tick</title>
<desc id="countersign-d">The countersign that comes back on every Tide Reckoning: a green tick and the initial T in a ruled box, 'examined and entered' in a clerk's small capitals, on no ground.</desc>
<rect x="8" y="8" width="244" height="144" fill="none" stroke="#2E7A46" stroke-width="2" transform="rotate(-3 130 80)"/>
<rect x="15" y="15" width="230" height="130" fill="none" stroke="#2E7A46" stroke-width="0.8" transform="rotate(-3 130 80)"/>
<g transform="rotate(-3 130 80)">
<path d="M70,86 l17,23.8 l37.4,-57.8" fill="none" stroke="#2E7A46" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M138,58.8 h30.6 m-15.3,0 v44.2" fill="none" stroke="#2E7A46" stroke-width="5.4" stroke-linecap="round"/>
<text x="130" y="132" font-size="13" font-family="serif" fill="#2E7A46" text-anchor="middle" letter-spacing="2.9" font-weight="normal">EXAMINED AND ENTERED</text>
</g>
</svg>
