<title id="port-seal-rewritten-t">Port seal: rewritten</title>
<desc id="port-seal-rewritten-d">A port whose charter was rewritten: no wax, a pen mark in blue-black ink where the seal sat, the nib that made it, and a kept lane ruled out from the port.</desc>
