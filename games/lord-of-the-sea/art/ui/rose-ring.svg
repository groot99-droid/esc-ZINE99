<title id="rose-ring-t">HUD: the rose ring</title>
<desc id="rose-ring-d">The only HUD aboard: a small engraved compass rose in two rings. The outer ring is the region's Wild, from ruled Company blue to wave-hatched sea-green; the inner ring is the devotion tier; a gold notch marks where they meet, the effective tier.</desc>
