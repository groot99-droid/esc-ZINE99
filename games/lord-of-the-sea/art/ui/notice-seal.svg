<title id="notice-seal-t">Notice: the Company seal that darkens</title>
<desc id="notice-seal-d">Notice, shown on the chart table as a Company seal in four states: pale and barely pressed, then redder, then dark, then nearly black with the watching eye of a lit lighthouse beam across it.</desc>
