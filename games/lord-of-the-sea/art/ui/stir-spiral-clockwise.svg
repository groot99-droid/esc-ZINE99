<title id="stir-spiral-clockwise-t">Stir gesture: clockwise</title>
<desc id="stir-spiral-clockwise-d">The stir gesture clockwise: a faint sea-ink spiral following the hand, a ring left by each completed circle, the tier reached labelled above, and the water raised below it.</desc>
