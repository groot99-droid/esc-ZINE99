<title id="tea-board-crack-t">Tea Board: a cracked lane</title>
<desc id="tea-board-crack-d">A lane of the porcelain board cracked by a second Stir in one High tide: a dark fracture runs through its three slots with hairlines either side and one chip gone, and it scores for no one.</desc>
