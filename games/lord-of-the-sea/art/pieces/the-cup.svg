<title id="the-cup-t">The Cup: tea and hot water on the board</title>
<desc id="the-cup-d">Two blue-and-white export cups on the porcelain board: one of brown tea, steaming, the blend from the jar in Alexi's cabinet, the other of plain hot water; between them a chit on Company stock under a clerk's ruler.</desc>
