<title id="instrument-parallel-rule-t">Dead Reckoning: the parallel rule</title>
<desc id="instrument-parallel-rule-d">The parallel rule: two ebony bars edged in brass and joined by two swinging brass arms, lying open across the sheet with a pencilled course along its edge.</desc>
