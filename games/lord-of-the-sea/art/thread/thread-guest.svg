<title id="thread-guest-t">Thread: the left-slanted correction</title>
<desc id="thread-guest-d">The margin of a harbour-book page in engrossing hand. One word in the text is struck through, a caret points out past the red margin rule, and there the correction is written in a different, left-slanted hand in blue-black ink.</desc>
