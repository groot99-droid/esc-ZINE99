<title id="chit-5-trench-t">Chit 5, found on the trench floor</title>
<desc id="chit-5-trench-d">One of Alexi's chits, found on the trench floor: a chandler's slip that pays next tide, signed with a clockwise sea-ink spiral and stamped with the Company's mark; salt-bloomed and barnacled, a corner gone.</desc>
