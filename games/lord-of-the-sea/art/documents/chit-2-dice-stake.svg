<title id="chit-2-dice-stake-t">Chit 2, found laid as a dice stake</title>
<desc id="chit-2-dice-stake-d">One of Alexi's chits, found laid as a dice stake: a chandler's slip that pays next tide, signed with a clockwise sea-ink spiral and stamped with the Company's mark; ringed by a cup and marked with chalk.</desc>
