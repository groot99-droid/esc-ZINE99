<title id="scholars-footnote-t">A footnote by the future scholars</title>
<desc id="scholars-footnote-d">The foot of a printed page from a later edition: a short rule, a dagger, and two lines of small type in a different, modern hand-set face, on whiter paper than the deed it annotates; a pencilled query beside it.</desc>
