<title id="chit-6-under-the-board-t">Chit 6, found under the Comptroller's board</title>
<desc id="chit-6-under-the-board-d">One of Alexi's chits, found under the Comptroller's board: a chandler's slip that pays next tide, signed with a clockwise sea-ink spiral and stamped with the Company's mark; lying on blue-and-white, the board's foot-ring pressed into it, the pledge struck out and smudged.</desc>
