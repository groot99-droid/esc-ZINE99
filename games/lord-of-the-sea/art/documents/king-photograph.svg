<title id="king-photograph-t">The photograph: two young men at the oars</title>
<desc id="king-photograph-d">A small albumen photograph curling at the edges, browned and foxed: two young men from behind at the oars of a gig on flat water, one broad-backed, one slight; no faces. Pencilled on the mount, an occasion and no names.</desc>
