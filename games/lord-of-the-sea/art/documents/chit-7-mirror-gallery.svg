<title id="chit-7-mirror-gallery-t">Chit 7, found in the mirror gallery</title>
<desc id="chit-7-mirror-gallery-d">One of Alexi's chits, found in the mirror gallery: a chandler's slip that pays next tide, signed with a clockwise sea-ink spiral and stamped with the Company's mark; lying on the glass with its own reflection, the pledge struck out.</desc>
