<title id="chit-unsigned-t">A chit, unsigned</title>
<desc id="chit-unsigned-d">One of Alexi's chits after Pay: the same chandler's slip, wet through, its pledge and 'pays next tide' run out into sea-ink threads, and the spiral where he signed unwound counter-clockwise to a blank.</desc>
