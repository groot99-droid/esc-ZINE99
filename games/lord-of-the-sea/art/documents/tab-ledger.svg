<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-labelledby="tab-ledger-t tab-ledger-d">
<title id="tab-ledger-t">The tab: a page of the chandler's ledger</title>
<desc id="tab-ledger-d">A page of a chandler's ledger, the page the tab is kept on: cream stock ruled in faint blue, a red margin rule and a double red money column, a clockwise sea-ink spiral in the head margin where the account is signed, and a tea ring and thumb-grime at the corner. Left clear for the chits to be laid on it.</desc>
