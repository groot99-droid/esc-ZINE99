<title id="chit-3-strongbox-t">Chit 3, found in the strongbox of the sunken tender</title>
<desc id="chit-3-strongbox-d">One of Alexi's chits, found in the strongbox of the sunken tender: a chandler's slip that pays next tide, signed with a clockwise sea-ink spiral and stamped with the Company's mark; sea-swollen, the pledge run to a blur that seawater might raise again.</desc>
