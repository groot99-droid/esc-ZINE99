<title id="chit-1-bottle-neck-t">Chit 1, found tied at a bottle's neck</title>
<desc id="chit-1-bottle-neck-d">One of Alexi's chits, found tied at a bottle's neck: a chandler's slip that pays next tide, signed with a clockwise sea-ink spiral and stamped with the Company's mark; a hole punched for the string and the curl of the glass still in it.</desc>
