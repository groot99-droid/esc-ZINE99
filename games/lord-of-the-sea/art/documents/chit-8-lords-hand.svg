<title id="chit-8-lords-hand-t">Chit 8, found in the Lord of Tea's own hand</title>
<desc id="chit-8-lords-hand-d">One of Alexi's chits, found in the Lord of Tea's own hand: a chandler's slip that pays next tide, signed with a clockwise sea-ink spiral and stamped with the Company's mark; on Company stock, ruled, ticked in green, the pledge struck out.</desc>
