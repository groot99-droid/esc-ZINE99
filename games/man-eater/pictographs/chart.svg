<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="chart-t chart-d">
<title id="chart-t">The Chart: Medical graph paper</title>
<desc id="chart-d">The Chart (1D): Fisk's own measurements on medical graph paper, read like a doctor's chart. Typed axes run Day 1 to Day 7; his height is plotted in pencil and it lies along the printed target curve on the sheet slid half under it, which shows the change is on schedule. The current day's column is outlined, two telling points are circled, and the hypothesis card ROUTINE is stamped broken.</desc>
<rect x="0" y="0" width="1200" height="800" fill="#4b3a2a"/>
