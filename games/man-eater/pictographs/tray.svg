<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="tray-t tray-d">
<title id="tray-t">The Tray: Isotype pictograms</title>
<desc id="tray-d">The Tray (1D): the noon portioning game told as an Isotype chart of counted flat icons. Across the top, the orderly's gaze runs its eight-second cycle and rests on Fisk for three; below, the cut ration lies as six pieces on the tray, with the pill beside it. Each row counts where the pieces went (to the mouth, into the napkin that holds three, passed to Jax, left on the tray), and the bottom row shows the man growing a step taller for every piece eaten.</desc>
