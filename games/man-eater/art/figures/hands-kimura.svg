<title id="hands-kimura-t">Kimura's hands at the table</title>
<desc id="hands-kimura-d">Kimura's seat from above: the radio operator's headphones set down on the cloth, their cord running off the table, and his fingers resting one to a card on the tricks he is counting; the suit of Sparks.</desc>
