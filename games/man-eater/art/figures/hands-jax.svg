<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-labelledby="hands-jax-t hands-jax-d">
<title id="hands-jax-t">Jax's hands at the table</title>
<desc id="hands-jax-d">Jax's seat from above: one finger tapping the cloth, two rings of sound spreading from it, and a bootlace with his knots in it trailing from the other fist; the suit of Keys, inherited with the chair.</desc>
