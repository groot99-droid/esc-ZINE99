<title id="cutout-fisk-stoop-t">Halls cut-out: Fisk folded down to pass for a man</title>
<desc id="cutout-fisk-stoop-d">Fisk at nearly three metres folding himself down to the height of an orderly, knees bent deep and back bowed, hands almost on the floor: the stoop that gets an eater past a hung sheet.</desc>
