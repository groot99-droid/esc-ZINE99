<title id="cutout-guard-ran-t">Halls cut-out: the guard who backs away</title>
<desc id="cutout-guard-ran-d">The guard who has seen only a shadow as high as the ceiling: leaning back on his heels with both hands up, his flashlight dropped and rolling, its cone lying flat along the floor.</desc>
