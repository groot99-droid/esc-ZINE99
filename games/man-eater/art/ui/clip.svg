<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220" role="img" aria-labelledby="clip-t clip-d">
<title id="clip-t">The clipboard clip</title>
<desc id="clip-d">The spring clip from the top of the orderly's clipboard: pressed steel with a rolled lip, two rivets, a hanging hole, scratches, and the stencilled form number; it throws a long shadow down the page.</desc>
