<title id="thread-guest-t">The tea caddy on the staff shelf</title>
<desc id="thread-guest-d">A blue-and-white tea caddy with a company mark on its side, standing on a steel shelf in the staff mess between a stencilled ration tin and a stack of enamel mugs, under the green and cream wall; light from the high window throws its shadow long and down.</desc>
