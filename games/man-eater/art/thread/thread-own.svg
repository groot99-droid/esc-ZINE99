<title id="thread-own-t">The envelope stamped HOLD</title>
<desc id="thread-own-d">A sealed letter that never left the base: a worn envelope lying on the mail room's steel counter, its address a child's house drawn small in pencil, a red HOLD stamp across the front and frost creeping in from one corner.</desc>
