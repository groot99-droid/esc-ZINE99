<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="clock-night-1-t clock-night-1-d">
<title id="clock-night-1-t">The 10:00 clock card, night 1</title>
<desc id="clock-night-1-d">The door at 10:00 on night 1: the bunk room clock at ten precisely on the moonlit wall, the tall door with its high steel lever and low brass knob, the choice typed along the bottom; the clock hangs nearer and the frost reaches further than the night before.</desc>
