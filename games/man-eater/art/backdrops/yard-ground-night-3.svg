<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" width="1280" height="880" role="img" aria-labelledby="yard-ground-night-3-t yard-ground-night-3-d">
<title id="yard-ground-night-3-t">Snow line ground, night 3: the yard as the mode plays it</title>
<desc id="yard-ground-night-3-d">The night-3 yard as one unframed aerial print at the scale the Snow line mode plays on: the barracks, mess, store, latrine and kennel shed as roofs with long shadows, the empty dog run beside the shed, a drift, old vehicle ruts along the service road, the tree line and the wire along the top edge.</desc>
