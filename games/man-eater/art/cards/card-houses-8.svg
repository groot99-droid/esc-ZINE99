<title id="card-houses-8-t">Short Rations: 8 of Houses</title>
<desc id="card-houses-8-d">Ration-issue card, the 8 of Houses (Duarte's suit): worn card stock, the rank in army stencil at two corners, 8 of eight issue holes punched, and drawn by hand in the middle a hillside of 8 houses, one window lit.</desc>
