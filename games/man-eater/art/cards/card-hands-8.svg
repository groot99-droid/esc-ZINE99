<title id="card-hands-8-t">Short Rations: 8 of Hands</title>
<desc id="card-hands-8-d">Ration-issue card, the 8 of Hands (Fisk's suit): worn card stock, the rank in army stencil at two corners, 8 of eight issue holes punched, and drawn by hand in the middle a hand counting 8 on its fingers.</desc>
