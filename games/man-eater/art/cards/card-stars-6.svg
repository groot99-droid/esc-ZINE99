<title id="card-stars-6-t">Short Rations: 6 of Stars</title>
<desc id="card-stars-6-d">Ration-issue card, the 6 of Stars (Hollis's suit): worn card stock, the rank in army stencil at two corners, 6 of eight issue holes punched, and drawn by hand in the middle 6 stars over the wire, joined in pencil.</desc>
