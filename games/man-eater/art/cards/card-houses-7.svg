<title id="card-houses-7-t">Short Rations: 7 of Houses</title>
<desc id="card-houses-7-d">Ration-issue card, the 7 of Houses (Duarte's suit): worn card stock, the rank in army stencil at two corners, 7 of eight issue holes punched, and drawn by hand in the middle a hillside of 7 houses, one window lit.</desc>
