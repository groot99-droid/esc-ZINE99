<title id="card-hands-7-t">Short Rations: 7 of Hands</title>
<desc id="card-hands-7-d">Ration-issue card, the 7 of Hands (Fisk's suit): worn card stock, the rank in army stencil at two corners, 7 of eight issue holes punched, and drawn by hand in the middle a hand counting 7 on its fingers.</desc>
