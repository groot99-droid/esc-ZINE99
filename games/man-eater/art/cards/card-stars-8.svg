<title id="card-stars-8-t">Short Rations: 8 of Stars</title>
<desc id="card-stars-8-d">Ration-issue card, the 8 of Stars (Hollis's suit): worn card stock, the rank in army stencil at two corners, 8 of eight issue holes punched, and drawn by hand in the middle 8 stars over the wire, joined in pencil.</desc>
