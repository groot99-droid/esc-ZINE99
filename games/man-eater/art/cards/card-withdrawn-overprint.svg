<title id="card-withdrawn-overprint-t">Short Rations: the WITHDRAWN overprint</title>
<desc id="card-withdrawn-overprint-d">The rubber stamp that marks an empty chair's eight: WITHDRAWN in red, boxed, struck crooked across the card with a fainter second strike beside it and flecks where the pad was too wet. Transparent, to lay over any eight.</desc>
