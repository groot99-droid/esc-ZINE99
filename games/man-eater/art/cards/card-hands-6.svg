<title id="card-hands-6-t">Short Rations: 6 of Hands</title>
<desc id="card-hands-6-d">Ration-issue card, the 6 of Hands (Fisk's suit): worn card stock, the rank in army stencil at two corners, 6 of eight issue holes punched, and drawn by hand in the middle a hand counting 6 on its fingers.</desc>
