<title id="card-stars-7-t">Short Rations: 7 of Stars</title>
<desc id="card-stars-7-d">Ration-issue card, the 7 of Stars (Hollis's suit): worn card stock, the rank in army stencil at two corners, 7 of eight issue holes punched, and drawn by hand in the middle 7 stars over the wire, joined in pencil.</desc>
