<title id="card-houses-6-t">Short Rations: 6 of Houses</title>
<desc id="card-houses-6-d">Ration-issue card, the 6 of Houses (Duarte's suit): worn card stock, the rank in army stencil at two corners, 6 of eight issue holes punched, and drawn by hand in the middle a hillside of 6 houses, one window lit.</desc>
