<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="cutout-flashlight-t cutout-flashlight-d">
<title id="cutout-flashlight-t">Halls cut-out: the flashlight and its cone</title>
<desc id="cutout-flashlight-d">A guard's flashlight and the cone it throws down the hall: hard and pale at the lens, thinning to nothing, with dust standing in it. Whatever the cone holds for a second and a half is seen.</desc>
