<title id="ending-lettering-brought-along-t">Ending lettering: Brought Along</title>
<desc id="ending-lettering-brought-along-d">The ending's name, Brought Along, as the heading of a survey sheet in forest-green printed ink over faint contours; 2 of its letters have gone, leaving only the plate pressure. Under it, Tam's pencil copy of the name and one line: "Someone at home no longer knows to wait."</desc>
