<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="outline-june-t outline-june-d">
<title id="outline-june-t">Portrait outline: June</title>
<desc id="outline-june-d">June as an empty contour: seventeen, two puffs of hair, a walkie-talkie held up beside her ear with its aerial out. On Tam's ruled People page the graphite is rubbed in all round, and the sitter is the one place left blank: a contour with nothing inside it.</desc>
