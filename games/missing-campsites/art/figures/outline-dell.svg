<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="outline-dell-t outline-dell-d">
<title id="outline-dell-t">Portrait outline: Dell</title>
<desc id="outline-dell-d">Dell as an empty contour: broad shoulders, close curls, his grandmother's recipe card held up in one hand. On Tam's ruled People page the graphite is rubbed in all round, and the sitter is the one place left blank: a contour with nothing inside it.</desc>
