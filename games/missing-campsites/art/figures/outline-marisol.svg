<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="outline-marisol-t outline-marisol-d">
<title id="outline-marisol-t">Portrait outline: Marisol Teague</title>
<desc id="outline-marisol-d">Marisol as an empty contour: the ranger's flat-brimmed hat with its heron badge, a pressed collar, the logbook under one arm. On Tam's ruled People page the graphite is rubbed in all round, and the sitter is the one place left blank: a contour with nothing inside it.</desc>
