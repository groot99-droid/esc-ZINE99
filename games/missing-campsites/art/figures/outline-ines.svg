<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="outline-ines-t outline-ines-d">
<title id="outline-ines-t">Portrait outline: Inés</title>
<desc id="outline-ines-d">Inés as an empty contour: long hair past her shoulders and a camera on its strap at her chest. On Tam's ruled People page the graphite is rubbed in all round, and the sitter is the one place left blank: a contour with nothing inside it.</desc>
