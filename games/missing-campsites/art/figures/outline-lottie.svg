<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="outline-lottie-t outline-lottie-d">
<title id="outline-lottie-t">Portrait outline: Lottie</title>
<desc id="outline-lottie-d">Lottie as an empty contour: eight years old, low on the page, two bunches of hair, both hands on a bicycle's handlebars and its bell. On Tam's ruled People page the graphite is rubbed in all round, and the sitter is the one place left blank: a contour with nothing inside it.</desc>
