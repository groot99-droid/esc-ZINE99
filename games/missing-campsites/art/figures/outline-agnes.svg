<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="outline-agnes-t outline-agnes-d">
<title id="outline-agnes-t">Portrait outline: Agnes Halloran</title>
<desc id="outline-agnes-d">Agnes as an empty contour: hair pinned up, a buttoned cardigan, a telephone receiver at her ear and its cord coiling down. On Tam's ruled People page the graphite is rubbed in all round, and the sitter is the one place left blank: a contour with nothing inside it.</desc>
