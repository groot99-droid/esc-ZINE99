<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-labelledby="outline-rafe-t outline-rafe-d">
<title id="outline-rafe-t">Portrait outline: Rafe</title>
<desc id="outline-rafe-d">Rafe as an empty contour: tall and narrow in a collared jacket, the van keys hanging from his fingers. On Tam's ruled People page the graphite is rubbed in all round, and the sitter is the one place left blank: a contour with nothing inside it.</desc>
