<text x="300" y="50" font-size="13" font-family="sans-serif" fill="#2F6B3A" letter-spacing="6" font-weight="normal">POST CARD</text>
<rect x="740" y="50" width="96" height="116" fill="#F6EFDC" stroke="#2F6B3A" stroke-width="1.5" stroke-dasharray="3 3"/>
