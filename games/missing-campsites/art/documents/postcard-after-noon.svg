<circle cx="706" cy="118" r="36" fill="none" stroke="#444" stroke-width="1.6" opacity="0.6"/>
<path d="M730,96 C735,95.3 750,91.3 760,92 C770,92.7 778.3,99.7 790,100 C801.7,100.3 823.3,95 830,94" fill="none" stroke="#444" stroke-width="1.6" opacity="0.5"/>
