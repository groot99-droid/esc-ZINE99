<line x1="580" y1="300" x2="830" y2="300" stroke="#2F6B3A" stroke-width="1"/>
<line x1="580" y1="356" x2="830" y2="356" stroke="#2F6B3A" stroke-width="1"/>
<line x1="580" y1="412" x2="830" y2="412" stroke="#2F6B3A" stroke-width="1"/>
<text x="590" y="290" font-size="34" font-family="serif" fill="#27386b" font-style="italic" transform="translate(590 290) skewX(-14) translate(-590 -290)">Tam</text>
<text x="60" y="330" font-size="21" font-family="serif" fill="#27386b" font-style="italic" transform="translate(60 330) skewX(-14) translate(-60 -330)">Site 16. The tall cedar.</text>
<text x="60" y="363" font-size="21" font-family="serif" fill="#27386b" font-style="italic" transform="translate(60 363) skewX(-14) translate(-60 -363)">You fell out of it once, and laughed.</text>
<text x="60" y="408" font-size="21" font-family="serif" fill="#27386b" font-style="italic" transform="translate(60 408) skewX(-14) translate(-60 -408)">The heron sign. Wave at it</text>
<text x="60" y="441" font-size="21" font-family="serif" fill="#27386b" font-style="italic" transform="translate(60 441) skewX(-14) translate(-60 -441)">on the way in. We always did.</text>
<text x="60" y="486" font-size="21" font-family="serif" fill="#27386b" font-style="italic" transform="translate(60 486) skewX(-14) translate(-60 -486)">Site 21. The split boulder.</text>
<text x="60" y="519" font-size="21" font-family="serif" fill="#27386b" font-style="italic" transform="translate(60 519) skewX(-14) translate(-60 -519)">You slept in the crack of it.</text>
