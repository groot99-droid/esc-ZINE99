<title id="lens-front-page-t">The logbook's front page through the map lens, upside down</title>
<desc id="lens-front-page-d">A second playthrough's document: the round brass-rimmed map lens held over the booth counter, and under it, upside down because the book lies facing the ranger, the pencil front page of the logbook: the heading Sites, a party of five at 20 to 24 and an empty check-out, in a younger hand than the ink that keeps the book.</desc>
