<title id="chapter-3-t">Chapter 3: The Second Morning</title>
<desc id="chapter-3-d">Chapter 3's card: the back of Inés's camera with its three-by-three gallery. Eight frames show numbered posts in grey morning light; the frame for site 7 shows a clearing, and the file numbers skip. Beside the picture, the map's green legend box keeps its height with 6 of its nine rows printed; Tam's pencil count underneath agrees.</desc>
