<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="chapter-7-t chapter-7-d">
<title id="chapter-7-t">Chapter 7: The Other Side</title>
<desc id="chapter-7-d">Chapter 7's card: a pearl sky with no sun and no gradient, dark trunks at exact, equal intervals with nothing casting a shadow, a gravel road running straight between them to a small cedar booth at the far end with one window. Beside the picture, the map's green legend box keeps its height with 1 of its nine rows printed; Tam's pencil count underneath agrees.</desc>
