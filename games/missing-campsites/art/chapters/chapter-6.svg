<title id="chapter-6-t">Chapter 6: The Final Morning</title>
<desc id="chapter-6-d">Chapter 6's card: a phone held up against an even pearl sky, its screen showing no signal, no time, no date; behind it the five tents and trunks that have begun to stand at equal intervals, with no shadows under anything. Beside the picture, the map's green legend box keeps its height with 2 of its nine rows printed; Tam's pencil count underneath agrees.</desc>
