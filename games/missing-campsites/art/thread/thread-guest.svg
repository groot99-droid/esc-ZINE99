<title id="thread-guest-t">An envelope stamped HOLD</title>
<desc id="thread-guest-d">The object this game hides for the collection ring, in its own hand: one of the booth's drop-box fee envelopes lying on the ruled logbook page among the stubs, its licence-plate box left empty and a rubber stamp across it in the van's dull red: HOLD.</desc>
