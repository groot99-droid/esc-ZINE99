<title id="list-10-t">The List, 10: a guitar</title>
<desc id="list-10-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 10 held a guitar. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
