<title id="list-07-t">The List, 7: the owl box</title>
<desc id="list-07-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 7 held the owl box. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
