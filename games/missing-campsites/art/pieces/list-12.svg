<title id="list-12-t">The List, 12: milk in the creek</title>
<desc id="list-12-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 12 held milk in the creek. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
