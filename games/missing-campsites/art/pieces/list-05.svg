<title id="list-05-t">The List, 5: a blue enamel kettle</title>
<desc id="list-05-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 5 held a blue enamel kettle. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
