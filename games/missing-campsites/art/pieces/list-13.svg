<title id="list-13-t">The List, 13: a windbreak</title>
<desc id="list-13-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 13 held a windbreak. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
