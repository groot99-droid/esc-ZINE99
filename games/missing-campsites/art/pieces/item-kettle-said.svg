<title id="item-kettle-said-t">Pack List tile, as said: a blue enamel kettle</title>
<desc id="item-kettle-said-d">A Pack List tray tile in wax crayon on brown kraft paper: a blue enamel kettle, drawn the way a child draws what goes in the bag, as it lies in the tray when a friend has just said it: an ordinary tile, not yet circled.</desc>
