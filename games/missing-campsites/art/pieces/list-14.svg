<title id="list-14-t">The List, 14: a red wagon</title>
<desc id="list-14-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 14 held a red wagon. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
