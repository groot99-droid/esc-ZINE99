<title id="list-19-t">The List, 19: a lantern on a pole</title>
<desc id="list-19-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 19 held a lantern on a pole. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
