<title id="item-number-t">Pack List tile: Nell's telephone number</title>
<desc id="item-number-d">A Pack List tray tile in wax crayon on brown kraft paper: Nell's telephone number, drawn the way a child draws what goes in the bag, the thing a guest brings from home.</desc>
