<title id="list-03-t">The List, 3: a hammock</title>
<desc id="list-03-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 3 held a hammock. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
