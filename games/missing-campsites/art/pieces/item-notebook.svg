<title id="item-notebook-t">Pack List tile: a notebook</title>
<desc id="item-notebook-d">A Pack List tray tile in wax crayon on brown kraft paper: a notebook, drawn the way a child draws what goes in the bag, the item the seat nobody filled adds: one Tam wrote and never said.</desc>
