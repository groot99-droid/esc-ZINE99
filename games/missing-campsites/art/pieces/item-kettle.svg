<title id="item-kettle-t">Pack List tile: a blue enamel kettle</title>
<desc id="item-kettle-d">A Pack List tray tile in wax crayon on brown kraft paper: a blue enamel kettle, drawn the way a child draws what goes in the bag, and circled in red because nobody at the fire added it.</desc>
