<title id="list-09-t">The List, 9: the shallow pool</title>
<desc id="list-09-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 9 held the shallow pool. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
