<title id="list-16-t">The List, 16: the tall cedar</title>
<desc id="list-16-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 16 held the tall cedar. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
