<title id="list-11-t">The List, 11: a paddle</title>
<desc id="list-11-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 11 held a paddle. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
