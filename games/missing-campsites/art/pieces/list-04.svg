<title id="list-04-t">The List, 4: a dog's bowl</title>
<desc id="list-04-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 4 held a dog's bowl. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
