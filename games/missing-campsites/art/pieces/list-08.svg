<title id="list-08-t">The List, 8: a kite</title>
<desc id="list-08-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 8 held a kite. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
