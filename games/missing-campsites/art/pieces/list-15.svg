<title id="list-15-t">The List, 15: a radio</title>
<desc id="list-15-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 15 held a radio. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
