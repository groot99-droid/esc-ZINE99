<title id="list-18-t">The List, 18: a tyre swing</title>
<desc id="list-18-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 18 held a tyre swing. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
