<title id="list-02-t">The List, 2: a camp chair</title>
<desc id="list-02-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 2 held a camp chair. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
