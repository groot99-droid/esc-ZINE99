<title id="list-06-t">The List, 6: a fishing rod</title>
<desc id="list-06-d">One tile of the List on Tam's notebook paper, in a single pencil weight with hatching: site 6 held a fishing rod. The number is its place in the order the campground packed it; said backwards, the nineteen are the way out.</desc>
