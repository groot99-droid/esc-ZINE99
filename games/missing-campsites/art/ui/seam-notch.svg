<rect x="20" y="20" width="200" height="200" fill="none" stroke="#2F6B3A" stroke-width="1.4"/>
<text x="40" y="70" font-size="20" font-family="sans-serif" fill="#2F6B3A" font-weight="bold">1</text>
<rect x="70" y="56" width="118" height="12" fill="#2F6B3A" opacity="0.3"/>
<text x="40" y="114" font-size="20" font-family="sans-serif" fill="#2F6B3A" font-weight="bold">2</text>
<rect x="70" y="100" width="90" height="12" fill="#2F6B3A" opacity="0.3"/>
<path d="M20,136 h22 l10,10 l-10,10 h-22" fill="#F1EEE4" stroke="#2F6B3A" stroke-width="1.6"/>
<circle cx="34" cy="146" r="4" fill="none" stroke="#2F6B3A" stroke-width="1.4"/>
<text x="40" y="202" font-size="20" font-family="sans-serif" fill="#2F6B3A" font-weight="bold">4</text>
<rect x="70" y="188" width="104" height="12" fill="#2F6B3A" opacity="0.3"/>
<rect x="0" y="0" width="240" height="240" filter="url(#seam-notch-tooth2)"/>
