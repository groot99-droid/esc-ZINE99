<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="seam-notch-t seam-notch-d">
<title id="seam-notch-t">The seam notch</title>
<desc id="seam-notch-d">The Show seams accessibility mark: a printed objectives list numbered 1, 2, 4, with a small hollow notch in green hairline at the place where the third line was.</desc>
