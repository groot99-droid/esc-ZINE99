<title id="stamp-sure-t">Stamp: SURE</title>
<desc id="stamp-sure-d">The Sure stamp, three to a sheet: a rectangular rubber stamp in the van's dull red, pressed hard and crooked. A row stamped Sure cannot be corrected, and is built as written.</desc>
